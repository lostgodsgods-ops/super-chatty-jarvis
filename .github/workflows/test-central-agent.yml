name: Test Central Agent

on:
  pull_request:
    paths:
      - "central-agent/**"
      - ".github/workflows/deploy-central-agent.yml"
      - ".github/workflows/test-central-agent.yml"
  push:
    branches:
      - "feat/tavily-central-agent-search"
      - "feat/owner-approved-durable-knowledge-queue"
      - "feat/agentic-architecture-foundation"
    paths:
      - "central-agent/**"
      - ".github/workflows/deploy-central-agent.yml"
      - ".github/workflows/test-central-agent.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test policy, owner authentication, queue, provider routing and integrations
        run: node --test central-agent/policy.test.mjs central-agent/owner-auth.test.mjs central-agent/task-queue.test.mjs central-agent/architecture/architecture.test.mjs central-agent/architecture/worker-status.test.mjs
