name: Test Central Agent

on:
  pull_request:
    paths:
      - "central-agent/**"
      - ".github/workflows/deploy-central-agent.yml"
      - ".github/workflows/test-central-agent.yml"
  push:
    branches:
      - "feat/tavily-central-agent-search"
      - "feat/owner-approved-durable-knowledge-queue"
      - "feat/agentic-architecture-foundation"
      - "feat/live-search-first-chat"
      - "feat/redultron-live-research-resilience"
    paths:
      - "central-agent/**"
      - ".github/workflows/deploy-central-agent.yml"
      - ".github/workflows/test-central-agent.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Discover and run every Central Agent test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find central-agent -type f -name '*.test.mjs' -print | sort)
          test "${tests[@]}" -gt 0 || { echo "::error::No Central Agent test files were discovered."; exit 1; }
          printf 'Discovered %s Central Agent test files.\\n' "${#tests[@]}"
          printf '  %s\\n' "${tests[@]}"
          node --test "${tests[@]}"
