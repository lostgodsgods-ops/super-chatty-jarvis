name: REDULTRON Live Gateway Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

jobs:
  live-probe:
    name: Health and authenticated hybrid round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate required secrets without printing values
        env:
          BASE_URL: ${{ secrets.REDULTRON_WORKER_BASE_URL }}
          OWNER_SECRET: ${{ secrets.REDULTRON_OWNER_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_URL" || -z "$OWNER_SECRET" ]]; then
            echo "::error::Set REDULTRON_WORKER_BASE_URL and REDULTRON_OWNER_SECRET in repository Actions secrets."
            exit 1
          fi
          if [[ "$BASE_URL" != https://* || "$BASE_URL" == *\?* || "$BASE_URL" == *#* ]]; then
            echo "::error::REDULTRON_WORKER_BASE_URL must be a plain HTTPS origin/base URL."
            exit 1
          fi
          echo "Required probe configuration is present; values are not logged."

      - name: Probe health and OWNER_SECRET-authenticated hybrid execution
        env:
          BASE_URL: ${{ secrets.REDULTRON_WORKER_BASE_URL }}
          OWNER_SECRET: ${{ secrets.REDULTRON_OWNER_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          host="$(node -e 'const u=new URL(process.argv[1]); if(u.protocol!=="https:"||u.username||u.password) process.exit(2); process.stdout.write(u.hostname)' "$BASE_URL")"
          if ! getent ahosts "$host" >/dev/null 2>&1; then
            echo "::error::DNS resolution failed for configured Worker hostname; check Cloudflare route, custom-domain binding, and DNS records."
            exit 1
          fi
          echo "PASS: DNS resolved for configured Worker hostname."

          health_file="$(mktemp)"
          hybrid_file="$(mktemp)"
          invalid_auth_file="$(mktemp)"
          trap 'rm -f "$health_file" "$hybrid_file" "$invalid_auth_file"' EXIT

          health_status="$(curl --silent --show-error --max-time 10 --output "$health_file" --write-out '%{http_code}' "$BASE_URL/health")"
          if [[ "$health_status" != "200" ]]; then
            echo "::error::Health probe returned HTTP $health_status (expected 200)."
            exit 1
          fi
          if ! jq -e '.ok == true' "$health_file" >/dev/null; then
            echo "::error::Health response schema check failed."
            exit 1
          fi
          echo "PASS: /health returned HTTP 200 and ok=true."

          invalid_auth_status="$(curl --silent --show-error --max-time 10 --output "$invalid_auth_file" --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/internal/hybrid-probe" \
            -H 'content-type: application/json' \
            -H 'x-owner-secret: invalid-redultron-owner-secret-probe' \
            --data '{}')"
          if [[ "$invalid_auth_status" != "401" && "$invalid_auth_status" != "403" ]]; then
            echo "::error::Negative authentication control failed: invalid owner credential returned HTTP $invalid_auth_status (expected 401 or 403)."
            exit 1
          fi
          echo "PASS: invalid owner credential was rejected (HTTP $invalid_auth_status)."

          hybrid_status="$(curl --silent --show-error --max-time 15 --output "$hybrid_file" --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/internal/hybrid-probe" \
            -H 'content-type: application/json' \
            -H "x-owner-secret: $OWNER_SECRET" \
            --data '{}')"
          if [[ "$hybrid_status" != "200" ]]; then
            # Log only a constrained machine-readable code; never dump upstream body or headers.
            upstream_code="$(jq -r 'if type == "object" then (.code // .error // "UNKNOWN") else "UNKNOWN" end | if type == "string" and test("^[A-Z0-9_-]{1,64}$") then . else "UNRECOGNIZED" end' "$hybrid_file" 2>/dev/null || printf 'UNREADABLE_RESPONSE')"
            config_diag="$(jq -c '
              if type == "object" and (.configDiagnostics | type) == "object" then
                {
                  provider: (if (.configDiagnostics.provider | type) == "string" and (.configDiagnostics.provider | test("^(python|php|none)$")) then .configDiagnostics.provider else "UNKNOWN" end),
                  endpointConfigured: (if (.configDiagnostics.endpointConfigured | type) == "boolean" then .configDiagnostics.endpointConfigured else "UNKNOWN" end),
                  endpointValid: (if (.configDiagnostics.endpointValid | type) == "boolean" then .configDiagnostics.endpointValid else "UNKNOWN" end),
                  ownerSecretConfigured: (if (.configDiagnostics.ownerSecretConfigured | type) == "boolean" then .configDiagnostics.ownerSecretConfigured else "UNKNOWN" end),
                  ownerSecretPolicyValid: (if (.configDiagnostics.ownerSecretPolicyValid | type) == "boolean" then .configDiagnostics.ownerSecretPolicyValid else "UNKNOWN" end),
                  readyForRequest: (if (.configDiagnostics.readyForRequest | type) == "boolean" then .configDiagnostics.readyForRequest else "UNKNOWN" end),
                  failureCode: (if (.configDiagnostics.failureCode | type) == "string" and (.configDiagnostics.failureCode | test("^[A-Z0-9_-]{1,64}$")) then .configDiagnostics.failureCode else null end),
                  runtimeReachabilityVerified: (if (.configDiagnostics.runtimeReachabilityVerified | type) == "boolean" then .configDiagnostics.runtimeReachabilityVerified else "UNKNOWN" end),
                  ownerSecretMatchVerified: (if (.configDiagnostics.ownerSecretMatchVerified | type) == "boolean" then .configDiagnostics.ownerSecretMatchVerified else "UNKNOWN" end)
                }
              else { available: false }
              end' "$hybrid_file" 2>/dev/null || printf '{"available":false}')"
            echo "::error::Authenticated hybrid probe returned HTTP $hybrid_status (expected 200); sanitized upstream code=$upstream_code; sanitized config=$config_diag."
            exit 1
          fi
          if ! jq -e '
            .ok == true and
            .probe == "authenticated-hybrid-roundtrip" and
            .task == "summarize" and
            (.resultsSchemaValid == true or .resultSchemaValid == true) and
            (.engine == "python-edge-hybrid" or .engine == "php-edge-hybrid") and
            .fallbackEngaged == false and
            .hybridCoreExecutionVerified == true and
            ((.engine == "python-edge-hybrid" and .hybridPythonCoreExecutionVerified == true) or
             (.engine == "php-edge-hybrid" and .hybridPhpCoreExecutionVerified == true))
          ' "$hybrid_file" >/dev/null; then
            # Strict certification: HTTP 200 or a valid local fallback is not proof of Python execution.
            # Do not dump upstream response bodies, headers, or secrets into workflow logs.
            engine="$(jq -r 'if type == "object" and (.engine | type) == "string" then .engine | gsub("[^A-Za-z0-9_-]"; "")[0:64] else "UNKNOWN" end' "$hybrid_file" 2>/dev/null || printf 'UNREADABLE_RESPONSE')"
            fallback="$(jq -r 'if type == "object" and (.fallbackEngaged | type) == "boolean" then (.fallbackEngaged|tostring) else "UNKNOWN" end' "$hybrid_file" 2>/dev/null || printf 'UNKNOWN')"
            verified="$(jq -r 'if type == "object" and (.hybridCoreExecutionVerified | type) == "boolean" then (.hybridCoreExecutionVerified|tostring) else "UNKNOWN" end' "$hybrid_file" 2>/dev/null || printf 'UNKNOWN')"
            python_verified="$(jq -r 'if type == "object" and (.hybridPythonCoreExecutionVerified | type) == "boolean" then (.hybridPythonCoreExecutionVerified|tostring) else "UNKNOWN" end' "$hybrid_file" 2>/dev/null || printf 'UNKNOWN')"
            php_verified="$(jq -r 'if type == "object" and (.hybridPhpCoreExecutionVerified | type) == "boolean" then (.hybridPhpCoreExecutionVerified|tostring) else "UNKNOWN" end' "$hybrid_file" 2>/dev/null || printf 'UNKNOWN')"
            fallback_reason="$(jq -r 'if type == "object" and (.fallbackReason | type) == "string" then (.fallbackReason | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end' "$hybrid_file" 2>/dev/null || printf 'UNKNOWN')"
            config_diag="$(jq -c '
              if type == "object" and (.configDiagnostics | type) == "object" then
                {
                  provider: (if (.configDiagnostics.provider | type) == "string" and (.configDiagnostics.provider | test("^(python|php|none)$")) then .configDiagnostics.provider else "UNKNOWN" end),
                  endpointConfigured: (if (.configDiagnostics.endpointConfigured | type) == "boolean" then .configDiagnostics.endpointConfigured else "UNKNOWN" end),
                  endpointValid: (if (.configDiagnostics.endpointValid | type) == "boolean" then .configDiagnostics.endpointValid else "UNKNOWN" end),
                  ownerSecretConfigured: (if (.configDiagnostics.ownerSecretConfigured | type) == "boolean" then .configDiagnostics.ownerSecretConfigured else "UNKNOWN" end),
                  ownerSecretPolicyValid: (if (.configDiagnostics.ownerSecretPolicyValid | type) == "boolean" then .configDiagnostics.ownerSecretPolicyValid else "UNKNOWN" end),
                  readyForRequest: (if (.configDiagnostics.readyForRequest | type) == "boolean" then .configDiagnostics.readyForRequest else "UNKNOWN" end),
                  failureCode: (if (.configDiagnostics.failureCode | type) == "string" and (.configDiagnostics.failureCode | test("^[A-Z0-9_-]{1,64}$")) then .configDiagnostics.failureCode else null end),
                  runtimeReachabilityVerified: (if (.configDiagnostics.runtimeReachabilityVerified | type) == "boolean" then .configDiagnostics.runtimeReachabilityVerified else "UNKNOWN" end),
                  ownerSecretMatchVerified: (if (.configDiagnostics.ownerSecretMatchVerified | type) == "boolean" then .configDiagnostics.ownerSecretMatchVerified else "UNKNOWN" end)
                }
              else { available: false }
              end' "$hybrid_file" 2>/dev/null || printf '{"available":false}')"
            echo "::error::STRICT FAIL: configured upstream execution not certified; engine=$engine fallbackEngaged=$fallback hybridCoreExecutionVerified=$verified pythonVerified=$python_verified phpVerified=$php_verified fallbackReason=$fallback_reason sanitizedConfig=$config_diag."
            exit 1
          fi
          echo "PASS: OWNER_SECRET-authenticated configured upstream round-trip returned HTTP 200; strict engine, fallback, provider-specific execution-verification, and result-schema flags matched."
