name: REDULTRON Live Gateway Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

jobs:
  live-probe:
    name: Health and authenticated hybrid round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate required secrets without printing values
        env:
          BASE_URL: ${{ secrets.REDULTRON_WORKER_BASE_URL }}
          OWNER_SECRET: ${{ secrets.REDULTRON_OWNER_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_URL" || -z "$OWNER_SECRET" ]]; then
            echo "::error::Set REDULTRON_WORKER_BASE_URL and REDULTRON_OWNER_SECRET in repository Actions secrets."
            exit 1
          fi
          if [[ "$BASE_URL" != https://* || "$BASE_URL" == *\?* || "$BASE_URL" == *#* ]]; then
            echo "::error::REDULTRON_WORKER_BASE_URL must be a plain HTTPS origin/base URL."
            exit 1
          fi
          echo "Required probe configuration is present; values are not logged."

      - name: Probe health and OWNER_SECRET-authenticated hybrid execution
        env:
          BASE_URL: ${{ secrets.REDULTRON_WORKER_BASE_URL }}
          OWNER_SECRET: ${{ secrets.REDULTRON_OWNER_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          health_file="$(mktemp)"
          hybrid_file="$(mktemp)"
          trap 'rm -f "$health_file" "$hybrid_file"' EXIT

          health_status="$(curl --silent --show-error --max-time 10 --output "$health_file" --write-out '%{http_code}' "$BASE_URL/health")"
          if [[ "$health_status" != "200" ]]; then
            echo "::error::Health probe returned HTTP $health_status (expected 200)."
            exit 1
          fi
          if ! jq -e '.ok == true' "$health_file" >/dev/null; then
            echo "::error::Health response schema check failed."
            exit 1
          fi
          echo "PASS: /health returned HTTP 200 and ok=true."

          hybrid_status="$(curl --silent --show-error --max-time 15 --output "$hybrid_file" --write-out '%{http_code}' \
            -X POST "$BASE_URL/api/internal/hybrid-probe" \
            -H 'content-type: application/json' \
            -H "x-owner-secret: $OWNER_SECRET" \
            --data '{}')"
          if [[ "$hybrid_status" != "200" ]]; then
            # Log only a constrained machine-readable code; never dump upstream body or headers.
            upstream_code="$(jq -r 'if type == "object" then (.code // .error // "UNKNOWN") else "UNKNOWN" end | if type == "string" and test("^[A-Z0-9_-]{1,64}$") then . else "UNRECOGNIZED" end' "$hybrid_file" 2>/dev/null || printf 'UNREADABLE_RESPONSE')"
            echo "::error::Authenticated hybrid probe returned HTTP $hybrid_status (expected 200); sanitized upstream code=$upstream_code."
            exit 1
          fi
          if ! jq -e '
            .ok == true and
            .probe == "authenticated-hybrid-roundtrip" and
            .task == "summarize" and
            (.resultsSchemaValid == true or .resultSchemaValid == true) and
            .engine == "python-edge-hybrid" and
            .fallbackEngaged == false and
            .hybridPythonCoreExecutionVerified == true
          ' "$hybrid_file" >/dev/null; then
            # Strict certification: HTTP 200 or a valid local fallback is not proof of Python execution.
            # Do not dump upstream response bodies, headers, or secrets into workflow logs.
            engine="$(jq -r 'if type == "object" and (.engine | type) == "string" then .engine | gsub("[^A-Za-z0-9_-]"; "")[0:64] else "UNKNOWN" end' "$hybrid_file" 2>/dev/null || printf 'UNREADABLE_RESPONSE')"
            fallback="$(jq -r 'if type == "object" and (.fallbackEngaged | type) == "boolean" then (.fallbackEngaged|tostring) else "UNKNOWN" end' "$hybrid_file" 2>/dev/null || printf 'UNKNOWN')"
            verified="$(jq -r 'if type == "object" and (.hybridPythonCoreExecutionVerified | type) == "boolean" then (.hybridPythonCoreExecutionVerified|tostring) else "UNKNOWN" end' "$hybrid_file" 2>/dev/null || printf 'UNKNOWN')"
            fallback_reason="$(jq -r 'if type == "object" and (.fallbackReason | type) == "string" then (.fallbackReason | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end' "$hybrid_file" 2>/dev/null || printf 'UNKNOWN')"
            echo "::error::STRICT FAIL: Python upstream execution not certified; engine=$engine fallbackEngaged=$fallback hybridPythonCoreExecutionVerified=$verified fallbackReason=$fallback_reason."
            exit 1
          fi
          echo "PASS: OWNER_SECRET-authenticated Python upstream round-trip returned HTTP 200; strict engine, fallback, execution-verification, and result-schema flags matched."
