name: Deploy Super Chatty Jarvis site

on:
  workflow_dispatch:
    inputs:
      authorize_production_changes:
        description: "Authorize production changes only after reviewing the exact deployment run."
        required: true
        type: choice
        options:
          - deny
          - approve
        default: deny
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    if: ${{ github.ref == 'refs/heads/main' && inputs.authorize_production_changes == 'approve' }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run deployment safety tests
        run: npm test

      - name: Require deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Deployment blocked: add repository Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Normalize deployment token
        id: deployment-credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [[ "$token" =~ ^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+ ]]; then
            token="$(printf '%s' "$token" | sed -E 's/^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//')"
          fi
          if [[ -z "$token" || "$token" =~ [[:space:]] ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN must be a raw Cloudflare API token without internal whitespace."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'api_token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ steps.deployment-credentials.outputs.api_token }}
          accountId: "6c0d1ab7b0d730f94359a89a77a0dcf2"
          wranglerVersion: "4.149.0"
          command: deploy src/worker.mjs --config wrangler.jsonc

      - name: Verify deployed PWA release markers
        shell: bash
        env:
          PWA_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          expected_version="$(grep -oE 'REDULTRON-[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}-CORE-3\\.0-V[0-9]+' jarvis/index.html | head -n 1)"
          expected_cache="$(grep -oE 'redultron-core-shell-v[0-9]+-core-3' jarvis/sw.js | head -n 1)"
          test -n "$expected_version" || { echo "::error::Could not derive expected PWA version from repository source."; exit 1; }
          test -n "$expected_cache" || { echo "::error::Could not derive expected PWA cache from repository source."; exit 1; }

          fetch_asset() {
            local path="$1" output="$2" headers="$3" expected_type="$4"
            local status content_type
            status="$(curl --silent --show-error --location --max-redirs 4 --max-time 20 -D "$headers" -o "$output" -w '%{http_code}' "$PWA_URL$path")"
            test "$status" = "200" || { echo "::error::GET $path returned HTTP $status"; exit 1; }
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\\r",""); value=tolower($0)} END{print value}' "$headers" | tail -n 1)"
            case "$content_type" in
              *"$expected_type"*) ;;
              *) echo "::error::GET $path had unexpected Content-Type: $content_type"; exit 1 ;;
            esac
          }

          fetch_asset "/" "$tmp/index.html" "$tmp/root.headers" "text/html"
          grep -Fq 'REDULTRON CORE 3.0 · Neural Console' "$tmp/index.html"
          grep -Fq "$expected_version" "$tmp/index.html" || { echo "::error::Deployed HTML version does not match repository source ($expected_version)"; exit 1; }

          fetch_asset "/sw.js" "$tmp/sw-root.js" "$tmp/sw-root.headers" "javascript"
          grep -Fq "$expected_cache" "$tmp/sw-root.js" || { echo "::error::Root service-worker cache does not match repository source ($expected_cache)"; exit 1; }

          fetch_asset "/jarvis/sw.js" "$tmp/sw-subpath.js" "$tmp/sw-subpath.headers" "javascript"
          grep -Fq "$expected_cache" "$tmp/sw-subpath.js" || { echo "::error::Subpath service-worker cache does not match repository source ($expected_cache)"; exit 1; }

          fetch_asset "/manifest.webmanifest" "$tmp/manifest.json" "$tmp/manifest.headers" "application/manifest+json"
          node -e 'const m=require(process.argv[1]); if(m.name!=="REDULTRON CORE 3.0"||m.scope!=="./") throw Error("PWA manifest identity/scope mismatch");' "$tmp/manifest.json"

          code="$(curl --silent --show-error --max-time 15 -o "$tmp/health.json" -w '%{http_code}' "$PWA_URL/health")"
          test "$code" = "200" || { echo "::error::/health returned HTTP $code"; exit 1; }
          node -e 'const h=require(process.argv[1]); if(h.ok!==true) throw Error("Worker health is not ok");' "$tmp/health.json"
          echo "PASS: deployed PWA version, service-worker cache, manifest, MIME types, and Worker health match the checked-out source."
