name: Deploy Super Chatty Jarvis site

on:
  workflow_dispatch:
    inputs:
      authorize_production_changes:
        description: "Authorize production changes only after reviewing the exact deployment run."
        required: true
        type: choice
        options:
          - deny
          - approve
        default: deny
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    if: ${{ github.ref == 'refs/heads/main' && inputs.authorize_production_changes == 'approve' }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run deployment safety tests
        run: npm test

      - name: Require deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Deployment blocked: add repository Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Normalize deployment token
        id: deployment-credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [[ "$token" =~ ^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+ ]]; then
            token="$(printf '%s' "$token" | sed -E 's/^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//')"
          fi
          if [[ -z "$token" || "$token" =~ [[:space:]] ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN must be a raw Cloudflare API token without internal whitespace."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'api_token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ steps.deployment-credentials.outputs.api_token }}
          accountId: "6c0d1ab7b0d730f94359a89a77a0dcf2"
          wranglerVersion: "4.149.0"
          command: deploy src/worker.mjs --config wrangler.jsonc

      - name: Verify deployed PWA release markers
        shell: bash
        env:
          PWA_URL: ${{ vars.REDULTRON_WORKER_BASE_URL || 'https://shrill-silence-164f.lostgodsgods.workers.dev' }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          expected_version="$(grep -oE 'REDULTRON-[0-9]{4}\.[0-9]{2}\.[0-9]{2}-CORE-3\.0-V[0-9]+' jarvis/index.html | head -n 1)"
          expected_cache="$(grep -oE 'redultron-core-shell-v[0-9]+-core-3' jarvis/sw.js | head -n 1)"
          test -n "$expected_version" || { echo "::error::Could not derive expected PWA version from repository source."; exit 1; }
          test -n "$expected_cache" || { echo "::error::Could not derive expected PWA cache from repository source."; exit 1; }

          # Retry briefly after deploy to allow edge/CDN propagation; fail closed on persistent drift.
          fetch_asset() {
            local path="$1" output="$2" headers="$3" expected_type="$4"
            local marker1="${5:-}" marker2="${6:-}" require_no_cache="${7:-false}"
            local status content_type attempt matches cache_ok
            for attempt in 1 2 3 4 5 6; do
              if status="$(curl --silent --show-error --location --max-redirs 4 --max-time 20 -D "$headers" -o "$output" -w '%{http_code}' "$PWA_URL$path")"; then
                content_type="$(grep -i '^content-type:' "$headers" | tail -n 1 | tr -d '\r' | tr '[:upper:]' '[:lower:]' || true)"
                matches=true
                [[ -z "$marker1" ]] || grep -Fq "$marker1" "$output" || matches=false
                [[ -z "$marker2" ]] || grep -Fq "$marker2" "$output" || matches=false
                cache_ok=true
                if [[ "$require_no_cache" == "true" ]] && { ! grep -Eiq '^cache-control:.*no-cache' "$headers" || ! grep -Eiq '^cache-control:.*must-revalidate' "$headers"; }; then cache_ok=false; fi
                if [[ "$status" == "200" && "$content_type" == *"$expected_type"* && "$matches" == "true" && "$cache_ok" == "true" ]]; then
                  return 0
                fi
              else
                status="000"
              fi
              if [[ "$attempt" -lt 6 ]]; then sleep "$((attempt * 2))"; fi
            done
            echo "::error::GET $path did not match the expected status, Content-Type, cache policy, and release markers after bounded retries (last HTTP status=$status)."
            return 1
          }

          fetch_asset "/" "$tmp/index.html" "$tmp/root.headers" "text/html" "$expected_version" "REDULTRON CORE 3.0 · Neural Console" true
          node - "$tmp/index.html" "$expected_version" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const expected = process.argv[3];
          const tags = html.match(/<meta\b[^>]*>/gi) || [];
          const found = tags.some((tag) => {
            const attrs = new Map([...tag.matchAll(/([^\s=]+)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/g)]
              .map((m) => [m[1].toLowerCase(), m[2] ?? m[3] ?? m[4] ?? ""]));
            return attrs.get("name") === "application-version" && attrs.get("content") === expected;
          });
          if (!found) throw new Error("Production application-version meta tag does not match repository source.");
          NODE

          fetch_asset "/sw.js" "$tmp/sw-root.js" "$tmp/sw-root.headers" "javascript" "$expected_cache" "" true
          fetch_asset "/jarvis/sw.js" "$tmp/sw-subpath.js" "$tmp/sw-subpath.headers" "javascript" "$expected_cache" "" true

          cp jarvis/manifest.webmanifest "$tmp/source-manifest.json"
          fetch_asset "/manifest.webmanifest" "$tmp/manifest.json" "$tmp/manifest.headers" "application/manifest+json"
          node - "$tmp/source-manifest.json" "$tmp/manifest.json" <<'NODE'
          const fs = require("node:fs");
          const expected = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const actual = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const canonical = (value) => Array.isArray(value)
            ? value.map(canonical)
            : value && typeof value === "object"
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]))
              : value;
          if (JSON.stringify(canonical(expected)) !== JSON.stringify(canonical(actual))) {
            throw new Error("Production PWA manifest does not exactly match repository source.");
          }
          NODE

          health_ok=false
          for attempt in 1 2 3 4 5 6; do
            code="$(curl --silent --show-error --max-time 15 -o "$tmp/health.json" -w '%{http_code}' "$PWA_URL/health" || true)"
            if [[ "$code" == "200" ]] && node -e 'const fs=require("node:fs"); const h=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(h.ok!==true) process.exit(1);' "$tmp/health.json"; then
              health_ok=true
              break
            fi
            if [[ "$attempt" -lt 6 ]]; then sleep "$((attempt * 2))"; fi
          done
          [[ "$health_ok" == "true" ]] || { echo "::error::Worker /health did not return a valid ok=true response after bounded retries."; exit 1; }
          echo "PASS: deployed PWA version, service-worker cache, manifest, cache headers, MIME types, and Worker health match the checked-out source."
