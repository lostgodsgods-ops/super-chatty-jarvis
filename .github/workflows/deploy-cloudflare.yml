name: Deploy Super Chatty Jarvis site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run deployment safety tests
        run: npm test

      - name: Require deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Deployment blocked: add repository Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Normalize deployment credentials
        id: deployment-credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token="${CLOUDFLARE_API_TOKEN//\\r'/}"
          token="${token#"${token%%[![:space:]]*}"}"
          token="${token%"${token##*[![:space:]]}"}"
          if [[ "$token" =~ ^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+ ]]; then
            token="${token#* }"
          fi

          account_id="${CLOUDFLARE_ACCOUNT_ID//\\r'/}"
          account_id="${account_id#"${account_id%%[![:space:]]*}"}"
          account_id="${account_id%"${account_id##*[![:space:]]}"}"

          if [[ -z "$token" || "$token" =~ [[:space:]] ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN must be a raw Cloudflare API token without internal whitespace."
            exit 1
          fi
          if [[ ! "$account_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character Cloudflare account ID."
            exit 1
          fi

          echo "::add-mask::$token"
          echo "::add-mask::$account_id"
          printf 'api_token=%s\\n' "$token" >> "$GITHUB_OUTPUT"
          printf 'account_id=%s\\n' "$account_id" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.deployment-credentials.outputs.api_token }}
          accountId: ${{ steps.deployment-credentials.outputs.account_id }}
          wranglerVersion: "4.149.0"
          command: deploy src/worker.mjs --config wrangler.jsonc
