name: Passkey staging security tests

on:
  push:
    branches:
      - staging/passkey-webauthn
  pull_request:
    branches:
      - main
      - staging/passkey-webauthn

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run passkey security tests
        run: node --test test/passkey-security.test.mjs
