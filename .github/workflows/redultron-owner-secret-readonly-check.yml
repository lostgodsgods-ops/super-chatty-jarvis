name: REDULTRON Read-Only Owner Secret Match Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redultron-owner-secret-readonly-check
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      REDULTRON_OWNER_SECRET: ${{ secrets.REDULTRON_OWNER_SECRET }}
    steps:
      - name: Compare configured credentials without disclosure or mutation
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077

          if [[ -z "$RENDER_API_KEY" ]]; then
            echo "::error::BLOCKED: Missing RENDER_API_KEY; Render was not queried."
            exit 1
          fi
          if [[ -z "$RENDER_SERVICE_ID" ]]; then
            echo "::error::BLOCKED: Missing RENDER_SERVICE_ID; Render was not queried."
            exit 1
          fi
          if [[ ! "$RENDER_SERVICE_ID" =~ ^srv-[A-Za-z0-9]+$ ]]; then
            echo "::error::BLOCKED: RENDER_SERVICE_ID format is invalid; value suppressed."
            exit 1
          fi
          if [[ -z "$REDULTRON_OWNER_SECRET" ]]; then
            echo "::error::BLOCKED: Missing REDULTRON_OWNER_SECRET; value suppressed."
            exit 1
          fi

          auth_config="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "$auth_config" "$response_file"; unset RENDER_API_KEY REDULTRON_OWNER_SECRET' EXIT

          printf 'header = "Authorization: Bearer %s"\n' "$RENDER_API_KEY" > "$auth_config"
          chmod 600 "$auth_config"

          endpoint="https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100"
          status="$(curl --request GET --config "$auth_config" --silent --show-error --max-time 15 \
            --header 'Accept: application/json' \
            --output "$response_file" --write-out '%{http_code}' "$endpoint")"

          if [[ "$status" != "200" ]]; then
            echo "::error::BLOCKED: Render environment-variable listing returned HTTP $status; response body suppressed."
            exit 1
          fi

          node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const { timingSafeEqual } = require("node:crypto");
          const responsePath = process.argv[2];

          function fail(message) {
            console.error(message);
            process.exit(1);
          }

          let records;
          try {
            records = JSON.parse(fs.readFileSync(responsePath, "utf8"));
          } catch {
            fail("BLOCKED: Render environment-variable response was not valid JSON; body suppressed.");
          }

          if (!Array.isArray(records)) {
            fail("BLOCKED: Render environment-variable response had an unexpected schema; body suppressed.");
          }

          const ownerEntry = records.find(record => record?.envVar?.key === "OWNER_SECRET");
          if (typeof ownerEntry?.envVar?.value !== "string") {
            fail("BLOCKED: OWNER_SECRET was not found in the first 100 service environment variables; body suppressed.");
          }

          const githubSecret = process.env.REDULTRON_OWNER_SECRET;
          const renderSecret = ownerEntry.envVar.value;
          const validSecret = secret =>
            typeof secret === "string" &&
            secret.length >= 32 &&
            secret === secret.trim() &&
            !/[\r\n]/.test(secret);

          if (!validSecret(githubSecret) || !validSecret(renderSecret)) {
            fail("FAIL: One or both credentials violate the minimum 32-character or formatting policy; values suppressed.");
          }

          const githubBytes = Buffer.from(githubSecret, "utf8");
          const renderBytes = Buffer.from(renderSecret, "utf8");
          const matches = githubBytes.length === renderBytes.length &&
            timingSafeEqual(githubBytes, renderBytes);

          if (!matches) {
            fail("FAIL: Configured credentials do not match; values suppressed.");
          }

          console.log("PASS: Configured credentials match and satisfy the format policy; values suppressed.");
          NODE
