name: REDULTRON Read-Only Owner Secret Match Check

on:
  push:
    branches:
      - fix/python-owner-secret-sync

permissions:
  contents: read

concurrency:
  group: redultron-owner-secret-readonly-check
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      REDULTRON_OWNER_SECRET: ${{ secrets.REDULTRON_OWNER_SECRET }}
      RENDER_SERVICE_ID: srv-dbdhr0mi0phs739rv98g
    steps:
      - name: Compare Render and GitHub secret values without mutation or disclosure
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077

          if [[ -z "$RENDER_API_KEY" ]]; then
            echo "::error::BLOCKED: RENDER_API_KEY repository secret is missing; no values were read or changed."
            exit 1
          fi
          if [[ -z "$REDULTRON_OWNER_SECRET" || "${#REDULTRON_OWNER_SECRET}" -lt 32 ]]; then
            echo "::error::BLOCKED: REDULTRON_OWNER_SECRET is missing or shorter than the required minimum; value suppressed."
            exit 1
          fi

          current_file="$(mktemp)"
          trap 'rm -f "$current_file"; unset current_value REDULTRON_OWNER_SECRET RENDER_API_KEY' EXIT
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID"
          status="$(curl --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -o "$current_file" -w '%{http_code}' \
            "$api/env-vars/OWNER_SECRET")"

          if [[ "$status" != "200" ]]; then
            echo "::error::BLOCKED: Render secret metadata read returned HTTP $status; response body suppressed."
            exit 1
          fi

          current_value="$(jq -er '.value | strings' "$current_file" 2>/dev/null)" || {
            echo "::error::BLOCKED: Render OWNER_SECRET response was not a readable string; body suppressed."
            exit 1
          }

          if [[ "${#current_value}" -lt 32 ]]; then
            echo "::error::FAIL: Render OWNER_SECRET is shorter than the required minimum; value suppressed."
            exit 1
          fi

          if [[ "$current_value" == "$REDULTRON_OWNER_SECRET" ]]; then
            echo "PASS: GitHub REDULTRON_OWNER_SECRET matches Render OWNER_SECRET; both values suppressed."
          else
            echo "::error::FAIL: GitHub REDULTRON_OWNER_SECRET does not match Render OWNER_SECRET; both values suppressed."
            exit 1
          fi

          unset current_value
