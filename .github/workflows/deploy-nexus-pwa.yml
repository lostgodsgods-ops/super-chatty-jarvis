name: Verify NEXUS PWA (Worker ASSETS)

on:
  push:
    branches:
      - main
    paths:
      - "jarvis/**"
      - "tests/static-site.test.mjs"
      - ".github/workflows/deploy-nexus-pwa.yml"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-pwa-worker-assets-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Test NEXUS PWA served by production Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run repository tests
        run: npm test

      - name: Verify production Worker serves NEXUS assets
        shell: bash
        env:
          PWA_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Derive the expected release markers from the checked-out source.
          # Hard-coded versions caused false failures whenever the PWA cache
          # or application version was bumped in a later release.
          expected_version="$(grep -oE 'REDULTRON-[0-9]{4}\.[0-9]{2}\.[0-9]{2}-COGNITIVE-CORE-V[0-9]+' jarvis/index.html | head -n 1)"
          expected_cache="$(grep -oE 'redultron-core-shell-v[0-9]+-cognitive-core' jarvis/sw.js | head -n 1)"
          test -n "$expected_version" || { echo "::error::Could not derive the expected REDULTRON version from jarvis/index.html"; exit 1; }
          test -n "$expected_cache" || { echo "::error::Could not derive the expected PWA cache from jarvis/sw.js"; exit 1; }

          fetch_asset() {
            local path="$1" output="$2" headers="$3" expected_type="$4"
            local status content_type
            status="$(curl --silent --show-error --location --max-redirs 4 --max-time 20 -D "$headers" -o "$output" -w '%{http_code}' "$PWA_URL$path")"
            test "$status" = "200" || { echo "::error::GET $path returned HTTP $status"; exit 1; }
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\\r",""); value=tolower($0)} END{print value}' "$headers" | tail -n 1)"
            case "$content_type" in
              *"$expected_type"*) ;;
              *) echo "::error::GET $path had unexpected Content-Type: $content_type"; exit 1 ;;
            esac
          }

          fetch_asset "/" "$tmp/index.html" "$tmp/root.headers" "text/html"
          grep -Fq 'REDULTRON CORE 2.0 · Neural Console' "$tmp/index.html"
          grep -Fq 'id="updateAppBtn"' "$tmp/index.html"
          grep -Fq "$expected_version" "$tmp/index.html" || { echo "::error::Production HTML version does not match repository source ($expected_version)"; exit 1; }

          fetch_asset "/sw.js" "$tmp/sw-root.js" "$tmp/sw-root.headers" "javascript"
          grep -Fq "$expected_cache" "$tmp/sw-root.js" || { echo "::error::Root service worker cache does not match repository source ($expected_cache)"; exit 1; }
          grep -Eiq '^cache-control: no-cache, must-revalidate' "$tmp/root.headers"
          grep -Eiq '^cache-control: no-cache, must-revalidate' "$tmp/sw-root.headers"

          fetch_asset "/jarvis/sw.js" "$tmp/sw-subpath.js" "$tmp/sw-subpath.headers" "javascript"
          grep -Fq "$expected_cache" "$tmp/sw-subpath.js" || { echo "::error::Subpath service worker cache does not match repository source ($expected_cache)"; exit 1; }
          grep -Eiq '^cache-control: no-cache, must-revalidate' "$tmp/sw-subpath.headers"

          fetch_asset "/manifest.webmanifest" "$tmp/manifest.json" "$tmp/manifest.headers" "application/manifest+json"
          node -e 'const m=require(process.argv[1]); if(m.name!=="REDULTRON CORE 2.0"||m.scope!=="./") throw Error("PWA manifest identity/scope mismatch");' "$tmp/manifest.json"
          fetch_asset "/icon-192.png" "$tmp/icon-192.png" "$tmp/icon-192.headers" "image/png"
          fetch_asset "/icon-512.png" "$tmp/icon-512.png" "$tmp/icon-512.headers" "image/png"
          node -e 'const m=require(process.argv[1]); for(const [size,name] of [[192,"icon-192.png"],[512,"icon-512.png"]]) if(!m.icons.some(i=>i.src==="./"+name&&i.sizes===size+"x"+size&&i.type==="image/png")) throw Error("Missing install icon: "+name);' "$tmp/manifest.json"

          code="$(curl --silent --show-error --max-time 15 -o "$tmp/health.json" -w '%{http_code}' "$PWA_URL/health")"
          test "$code" = "200" || { echo "::error::/health returned HTTP $code"; exit 1; }
          node -e 'const h=require(process.argv[1]); if(h.ok!==true) throw Error("Worker health is not ok");' "$tmp/health.json"

          echo "{\"ok\":true,\"deploymentMode\":\"Worker ASSETS binding\",\"version\":\"$expected_version\",\"cache\":\"$expected_cache\",\"rootHTML\":\"PASS\",\"serviceWorker\":\"PASS\",\"manifest\":\"PASS\",\"health\":\"PASS\"}"
