name: PHP Core Contract

on:
  pull_request:
    paths:
      - "php-core/**"
      - ".github/workflows/php-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-core-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Syntax check
        run: php -l php-core/index.php
      - name: Run contract tests
        run: php php-core/tests.php
      - name: HTTP smoke test
        shell: bash
        run: |
          export OWNER_SECRET='ci-only-secret-with-more-than-32-characters'
          php -S 127.0.0.1:8788 php-core/index.php > /tmp/redultron-php-core.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --show-error --fail http://127.0.0.1:8788/health > /tmp/redultron-health.json; then
              break
            fi
            sleep 0.25
          done
          if ! grep -Fq '"service":"redultron-php-core"' /tmp/redultron-health.json; then
            cat /tmp/redultron-php-core.log
            cat /tmp/redultron-health.json
            exit 1
          fi
          status="$(curl --silent --show-error -o /tmp/redultron-result.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8788/v1/execute \
            -H 'Content-Type: application/json' \
            -H "X-Owner-Secret: $OWNER_SECRET" \
            -d '{"task":"summarize","text":"One. Two. Three. Four."}')"
          test "$status" = "200"
          grep -Fq '"result":"One. Two. Three."' /tmp/redultron-result.json
          auth_status="$(curl --silent --show-error -o /tmp/redultron-auth.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8788/v1/execute \
            -H 'Content-Type: application/json' \
            -H 'X-Owner-Secret: incorrect-test-secret' \
            -d '{"task":"summarize","text":"One."}')"
          test "$auth_status" = "401"
          echo "PASS: PHP Core live HTTP health, authenticated execution, and auth rejection"
