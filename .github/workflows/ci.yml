name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node tests and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Run test suite
        run: npm test
      - name: Check Central Agent module syntax
        run: |
          node --check central-agent/worker.mjs
          node --check central-agent/webauthn.mjs
          node --check central-agent/edge-guard.mjs
