name: REDULTRON Provenance Deploy and Strict Live Certification

on:
  workflow_dispatch:
    inputs:
      authorize_production_changes:
        description: "Authorize production secret synchronization and deployment only after reviewing the exact run."
        required: true
        type: choice
        options:
          - deny
          - approve
        default: deny
permissions:
  contents: read

concurrency:
  group: super-chatty-central-agent-deploy
  cancel-in-progress: false

jobs:
  deploy-and-certify:
    if: ${{ github.ref == 'refs/heads/main' && inputs.authorize_production_changes == 'approve' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
      PYTHON_CORE_URL: https://super-chatty-jarvis.onrender.com
      REDULTRON_OWNER_SECRET: ${{ secrets.REDULTRON_OWNER_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded Python Core health probe
        run: cd hybrid-core && python3 -m unittest -v test_health_probe.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require deployment and authenticated probe credentials
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PYTHON_CORE_URL"
          test -n "$REDULTRON_OWNER_SECRET"
          test -n "$RENDER_API_KEY" || { echo "::error::Missing RENDER_API_KEY; no production changes were made."; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "::error::Missing RENDER_SERVICE_ID; no production changes were made."; exit 1; }
          [[ "$RENDER_SERVICE_ID" =~ ^srv-[A-Za-z0-9]+$ ]] || { echo "::error::RENDER_SERVICE_ID format invalid; no production changes were made."; exit 1; }
          [[ "${#REDULTRON_OWNER_SECRET}" -ge 32 ]] || { echo "::error::REDULTRON_OWNER_SECRET must be at least 32 characters; value suppressed; no runtime secrets were changed."; exit 1; }
          node -e 'const secret=process.env.REDULTRON_OWNER_SECRET; if(secret !== secret.trim() || /[\\r\\n]/.test(secret)) { console.error("FAIL: REDULTRON_OWNER_SECRET must not contain surrounding whitespace or line breaks; value suppressed; no production changes were made."); process.exit(4); } console.log("PASS: owner secret formatting has no surrounding whitespace or line breaks; value suppressed.")'
          node -e 'const u=new URL(process.env.PYTHON_CORE_URL); if(u.protocol!=="https:"||u.username||u.password||u.search||u.hash||(u.pathname!=="/"&&u.pathname!=="/v1/execute")) process.exit(2); if(u.hostname!=="super-chatty-jarvis.onrender.com") { console.error("FAIL: PYTHON_CORE_URL hostname does not match the configured Render service; value suppressed."); process.exit(3); } console.log("PASS: Python endpoint hostname matches the configured Render service; hostname and value suppressed.")'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Synchronize OWNER_SECRET to Render sidecar
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          REDULTRON_OWNER_SECRET: ${{ secrets.REDULTRON_OWNER_SECRET }}
        run: |
          set -euo pipefail
          [[ "$RENDER_SERVICE_ID" =~ ^srv-[A-Za-z0-9]+$ ]] || { echo "::error::RENDER_SERVICE_ID format invalid; value suppressed."; exit 1; }
          [[ "${#REDULTRON_OWNER_SECRET}" -ge 32 ]] || { echo "::error::Owner secret length validation failed; value suppressed."; exit 1; }
          umask 077
          payload="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$payload" "$response"' EXIT
          node - "$payload" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const secret = process.env.REDULTRON_OWNER_SECRET;
          if (typeof secret !== "string" || secret.length < 32) throw new Error("Owner secret validation failed; value suppressed.");
          fs.writeFileSync(path, JSON.stringify({ value: secret }), { mode: 0o600 });
          NODE
          status="$(curl --silent --show-error --max-time 20 -X PUT -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' -H 'Accept: application/json' --data-binary "@$payload" -o "$response" -w '%{http_code}' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/OWNER_SECRET")"
          if [[ "$status" != "200" ]]; then
            echo "::error::Render OWNER_SECRET synchronization failed with HTTP $status; response body and credentials suppressed."
            exit 1
          fi
          echo "PASS: Render OWNER_SECRET updated through the single-variable endpoint; value suppressed."

      - name: Deploy Render sidecar with synchronized owner secret
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          umask 077
          deploy_request="$(mktemp)"
          deploy_response="$(mktemp)"
          status_response="$(mktemp)"
          trap 'rm -f "$deploy_request" "$deploy_response" "$status_response"' EXIT
          printf '%s' '{"clearCache":"do_not_clear","deployMode":"build_and_deploy"}' > "$deploy_request"
          status="$(curl --silent --show-error --max-time 20 -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' -H 'Accept: application/json' --data-binary "@$deploy_request" -o "$deploy_response" -w '%{http_code}' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          if [[ "$status" != "201" && "$status" != "202" ]]; then
            echo "::error::Render deploy request failed with HTTP $status; response body and credentials suppressed."
            exit 1
          fi
          deploy_id="$(jq -er 'if type == "object" and (.id | type) == "string" and (.id | test("^dep-[A-Za-z0-9]+$")) then .id else empty end' "$deploy_response" 2>/dev/null)" || {
            echo "::error::Render deploy response did not contain a valid deployment ID; response body suppressed."
            exit 1
          }
          deploy_state="UNKNOWN"
          for attempt in $(seq 1 24); do
            status="$(curl --silent --show-error --max-time 15 -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' -o "$status_response" -w '%{http_code}' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id")"
            if [[ "$status" != "200" ]]; then
              echo "::error::Render deploy status lookup failed with HTTP $status; response body suppressed."
              exit 1
            fi
            deploy_state="$(jq -r 'if type == "object" and (.status | type) == "string" then .status else "UNKNOWN" end' "$status_response" 2>/dev/null || printf 'UNKNOWN')"
            case "$deploy_state" in
              live)
                echo "PASS: Render deploy status is live; deploy ID and response body suppressed."
                break
                ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::Render sidecar deploy reached terminal state $deploy_state; response body suppressed."
                exit 1
                ;;
              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                sleep 5
                ;;
              *)
                echo "::error::Render sidecar returned an unrecognized deploy state; response body suppressed."
                exit 1
                ;;
            esac
          done
          if [[ "$deploy_state" != "live" ]]; then
            echo "::error::Render sidecar did not reach live state within the bounded 120-second wait; Worker deployment was not started."
            exit 1
          fi

      - name: Deploy exact GitHub commit with secrets atomically
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          node - "$secrets_file" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const payload = {
            PYTHON_CORE_URL: process.env.PYTHON_CORE_URL,
            OWNER_SECRET: process.env.REDULTRON_OWNER_SECRET
          };
          if (!payload.PYTHON_CORE_URL || typeof payload.OWNER_SECRET !== "string" || payload.OWNER_SECRET.length < 32) {
            throw new Error("Required Worker secret metadata validation failed; values suppressed.");
          }
          fs.writeFileSync(path, JSON.stringify(payload), { mode: 0o600 });
          NODE
          npx --yes wrangler@4 deploy --config central-agent/wrangler.jsonc --var "GITHUB_COMMIT_SHA:$GITHUB_SHA" --secrets-file "$secrets_file"

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$WORKER_URL/health")"
          test "$code" = "200"
          jq -e '.ok == true' "$body"
      - name: Verify Python Core health before execution probe
        shell: bash
        run: python3 hybrid-core/health_probe.py

      - name: Require actual authenticated Python hybrid execution
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          code="$(curl --silent --show-error --max-time 30 -X POST \
            -H "x-owner-secret: $REDULTRON_OWNER_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            -o "$body" -w '%{http_code}' "$WORKER_URL/api/internal/hybrid-probe")"
          if [[ "$code" != "200" ]]; then
            upstream_code="$(jq -r 'if type == "object" then (.code // .error // "UNKNOWN") | if type == "string" then gsub("[^A-Za-z0-9_-]"; "")[0:64] else "UNKNOWN" end else "UNKNOWN" end' "$body" 2>/dev/null || printf 'UNREADABLE_RESPONSE')"
            echo "::error::STRICT FAIL: probe endpoint returned HTTP $code; sanitized upstream code=$upstream_code."
            exit 1
          fi
          if ! jq -e '
            .ok == true and
            .probe == "authenticated-hybrid-roundtrip" and
            .task == "summarize" and
            (.engine == "python-edge-hybrid" or .engine == "php-edge-hybrid") and
            .fallbackEngaged == false and
            (.resultSchemaValid == true or .resultsSchemaValid == true) and
            .hybridCoreExecutionVerified == true and
            ((.engine == "python-edge-hybrid" and .hybridPythonCoreExecutionVerified == true) or
             (.engine == "php-edge-hybrid" and .hybridPhpCoreExecutionVerified == true))
          ' "$body" >/dev/null; then
            jq -c '{
              ok: (if (.ok | type) == "boolean" then .ok else "UNKNOWN" end),
              probe: (if (.probe | type) == "string" then (.probe | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              probeTask: (if (.task | type) == "string" then (.task | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              engine: (if (.engine | type) == "string" then (.engine | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              fallbackEngaged: (if (.fallbackEngaged | type) == "boolean" then .fallbackEngaged else "UNKNOWN" end),
              fallbackReason: (if (.fallbackReason | type) == "string" then (.fallbackReason | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              hybridCoreExecutionVerified: (if (.hybridCoreExecutionVerified | type) == "boolean" then .hybridCoreExecutionVerified else "UNKNOWN" end),
              hybridPhpCoreExecutionVerified: (if (.hybridPhpCoreExecutionVerified | type) == "boolean" then .hybridPhpCoreExecutionVerified else "UNKNOWN" end),
              hybridPythonCoreExecutionVerified: (if (.hybridPythonCoreExecutionVerified | type) == "boolean" then .hybridPythonCoreExecutionVerified else "UNKNOWN" end),
              resultType: (.result | type)
            }' "$body" 2>/dev/null || echo "STRICT FAIL: response was not valid JSON; body suppressed."
            exit 1
          fi
          echo "PASS: strict authenticated Python hybrid execution and response schema verified."
