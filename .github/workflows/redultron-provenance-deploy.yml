name: REDULTRON Provenance Deploy and Strict Live Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-chatty-central-agent-deploy
  cancel-in-progress: false

jobs:
  deploy-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
      PYTHON_CORE_URL: ${{ secrets.PYTHON_CORE_URL }}
      REDULTRON_OWNER_SECRET: ${{ secrets.REDULTRON_OWNER_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require deployment and authenticated probe credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PYTHON_CORE_URL"
          test -n "$REDULTRON_OWNER_SECRET"
          node -e 'const u=new URL(process.env.PYTHON_CORE_URL); if(u.protocol!=="https:"||u.username||u.password||u.search||u.hash||(u.pathname!=="/"&&u.pathname!=="/v1/execute")) process.exit(2); console.log("PASS: Python endpoint configuration valid; value suppressed.")'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Synchronize owner secret to the deployed Worker without logging it
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PYTHON_CORE_URL" | npx --yes wrangler@4 secret put PYTHON_CORE_URL --config central-agent/wrangler.jsonc
          printf '%s' "$REDULTRON_OWNER_SECRET" | npx --yes wrangler@4 secret put OWNER_SECRET --config central-agent/wrangler.jsonc
          echo "PASS: PYTHON_CORE_URL and OWNER_SECRET bindings synchronized; values were not printed."
      - name: Deploy exact GitHub commit provenance
        run: |
          npx --yes wrangler@4 deploy --config central-agent/wrangler.jsonc --var "GITHUB_COMMIT_SHA:$GITHUB_SHA"
      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$WORKER_URL/health")"
          test "$code" = "200"
          jq -e '.ok == true' "$body"
      - name: Verify Python Core health before execution probe
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT
          health_url="$(node -e 'const u=new URL(process.env.PYTHON_CORE_URL); u.pathname="/health"; u.search=""; u.hash=""; process.stdout.write(u.toString())')"
          code="000"
          content_type=""
          curl_exit=0
          for attempt in 1 2 3; do
            : > "$body"
            : > "$headers"
            if meta="$(curl --silent --max-time 15 -D "$headers" -o "$body" -w '%{http_code}\n%{content_type}' "$health_url")"; then
              code="$(printf '%s\n' "$meta" | sed -n '1p')"
              content_type="$(printf '%s\n' "$meta" | sed -n '2p' | tr -cd 'A-Za-z0-9/;=.+ _-')"
              curl_exit=0
            else
              curl_exit="$?"
              code="000"
              content_type=""
            fi
            if [[ "$code" == "200" ]]; then
              break
            fi
            if [[ "$code" != "000" && ! "$code" =~ ^(502|503|504)$ ]]; then
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              if [[ "$attempt" -eq 1 ]]; then sleep 2; else sleep 4; fi
            fi
          done
          body_bytes="$(wc -c < "$body" | tr -d ' ')"
          response_kind="NON_JSON_TEXT"
          if [[ ! -s "$body" ]]; then
            response_kind="EMPTY_BODY"
          elif jq -e 'type == "object"' "$body" >/dev/null 2>&1; then
            response_kind="JSON_OBJECT"
          elif jq -e . "$body" >/dev/null 2>&1; then
            response_kind="VALID_JSON_OTHER"
          elif head -c 256 "$body" | grep -Eiq '^[[:space:]]*(<!doctype[[:space:]]+html|<html|<head|<body)'; then
            response_kind="HTML_PAGE"
          fi
          if [[ "$code" != "200" ]]; then
            safe_code="$(jq -r 'if type == "object" then (.code // .error // .service // "UNKNOWN") | if type == "string" then gsub("[^A-Za-z0-9_-]"; "")[0:64] else "UNKNOWN" end else "UNKNOWN" end' "$body" 2>/dev/null || printf 'UNREADABLE_RESPONSE')"
            echo "::error::Python Core health returned HTTP $code after at most 3 attempts; content_type=$content_type; body_bytes=$body_bytes; response_kind=$response_kind; curl_exit=$curl_exit; sanitized_code=$safe_code."
            exit 1
          fi
          if ! jq -e '.ok == true and .service == "redultron-python-core"' "$body" >/dev/null 2>&1; then
            safe_code="$(jq -r 'if type == "object" then (.code // .error // .service // "UNKNOWN") | if type == "string" then gsub("[^A-Za-z0-9_-]"; "")[0:64] else "UNKNOWN" end else "UNKNOWN" end' "$body" 2>/dev/null || printf 'UNREADABLE_RESPONSE')"
            echo "::error::Python Core health schema mismatch; content_type=$content_type; body_bytes=$body_bytes; response_kind=$response_kind; sanitized_code=$safe_code."
            exit 1
          fi
          echo "PASS: Python Core health endpoint is reachable; authenticated execution is verified separately."

      - name: Require actual authenticated Python hybrid execution
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          code="$(curl --silent --show-error --max-time 30 -X POST \
            -H "x-owner-secret: $REDULTRON_OWNER_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            -o "$body" -w '%{http_code}' "$WORKER_URL/api/internal/hybrid-probe")"
          if [[ "$code" != "200" ]]; then
            upstream_code="$(jq -r 'if type == "object" then (.code // .error // "UNKNOWN") | if type == "string" then gsub("[^A-Za-z0-9_-]"; "")[0:64] else "UNKNOWN" end else "UNKNOWN" end' "$body" 2>/dev/null || printf 'UNREADABLE_RESPONSE')"
            echo "::error::STRICT FAIL: probe endpoint returned HTTP $code; sanitized upstream code=$upstream_code."
            exit 1
          fi
          if ! jq -e '
            .ok == true and
            .probe == "authenticated-hybrid-roundtrip" and
            .task == "summarize" and
            .engine == "python-edge-hybrid" and
            .fallbackEngaged == false and
            (.resultSchemaValid == true or .resultsSchemaValid == true) and
            .hybridPythonCoreExecutionVerified == true
          ' "$body" >/dev/null; then
            jq -c '{
              ok: (if (.ok | type) == "boolean" then .ok else "UNKNOWN" end),
              probe: (if (.probe | type) == "string" then (.probe | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              probeTask: (if (.task | type) == "string" then (.task | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              engine: (if (.engine | type) == "string" then (.engine | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              fallbackEngaged: (if (.fallbackEngaged | type) == "boolean" then .fallbackEngaged else "UNKNOWN" end),
              fallbackReason: (if (.fallbackReason | type) == "string" then (.fallbackReason | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              hybridPythonCoreExecutionVerified: (if (.hybridPythonCoreExecutionVerified | type) == "boolean" then .hybridPythonCoreExecutionVerified else "UNKNOWN" end),
              resultType: (.result | type)
            }' "$body" 2>/dev/null || echo "STRICT FAIL: response was not valid JSON; body suppressed."
            exit 1
          fi
          echo "PASS: strict authenticated Python hybrid execution and response schema verified."
