name: REDULTRON Provenance Deploy and Strict Live Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-chatty-central-agent-deploy
  cancel-in-progress: false

jobs:
  deploy-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
      PYTHON_CORE_URL: https://super-chatty-jarvis.onrender.com
      REDULTRON_OWNER_SECRET: ${{ secrets.REDULTRON_OWNER_SECRET }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded Python Core health probe
        run: cd hybrid-core && python3 -m unittest -v test_health_probe.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require deployment and authenticated probe credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PYTHON_CORE_URL"
          test -n "$REDULTRON_OWNER_SECRET"
          [[ "${#REDULTRON_OWNER_SECRET}" -ge 32 ]] || { echo "::error::REDULTRON_OWNER_SECRET must be at least 32 characters; value suppressed and no runtime secrets were changed."; exit 1; }
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY repository secret is required to synchronize Python Core authentication safely; no runtime secrets were changed."; exit 1; }
          node -e 'const u=new URL(process.env.PYTHON_CORE_URL); if(u.protocol!=="https:"||u.username||u.password||u.search||u.hash||(u.pathname!=="/"&&u.pathname!=="/v1/execute")) process.exit(2); if(u.hostname!=="super-chatty-jarvis.onrender.com") { console.error("FAIL: PYTHON_CORE_URL hostname does not match the configured Render service; value suppressed."); process.exit(3); } console.log("PASS: Python endpoint hostname matches the configured Render service; hostname and value suppressed.")'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Synchronize canonical owner secret to Render Python Core
        shell: bash
        env:
          RENDER_SERVICE_ID: srv-dbdhr0mi0phs739rv98g
        run: |
          set -euo pipefail
          current_file="$(mktemp)"
          update_file="$(mktemp)"
          deploy_file="$(mktemp)"
          trap 'rm -f "$current_file" "$update_file" "$deploy_file"' EXIT
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID"
          current_code="$(curl --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -o "$current_file" -w '%{http_code}' "$api/env-vars/OWNER_SECRET")"
          if [[ "$current_code" == "200" ]]; then
            current_value="$(jq -er '.value | strings' "$current_file" 2>/dev/null)" || {
              echo "::error::RENDER_OWNER_SECRET_SYNC: current Render value could not be safely inspected; response suppressed."
              exit 1
            }
            if [[ "$current_value" == "$REDULTRON_OWNER_SECRET" ]]; then
              echo "PASS: Render OWNER_SECRET already matches canonical secret; no Render restart required."
              exit 0
            fi
          elif [[ "$current_code" != "404" ]]; then
            echo "::error::RENDER_OWNER_SECRET_SYNC: Render read failed with HTTP $current_code; response suppressed."
            exit 1
          fi

          payload="$(jq -n --arg value "$REDULTRON_OWNER_SECRET" '{value: $value}')"
          update_code="$(curl --silent --show-error --max-time 20 -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$payload" -o "$update_file" -w '%{http_code}' \
            "$api/env-vars/OWNER_SECRET")"
          unset payload current_value
          if [[ "$update_code" != "200" ]]; then
            echo "::error::RENDER_OWNER_SECRET_SYNC: Render update failed with HTTP $update_code; response suppressed."
            exit 1
          fi

          deploy_code="$(curl --silent --show-error --max-time 20 -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data '{"deployMode":"deploy_only","clearCache":"do_not_clear"}' \
            -o "$deploy_file" -w '%{http_code}' "$api/deploys")"
          if [[ "$deploy_code" != "201" && "$deploy_code" != "202" ]]; then
            echo "::error::RENDER_OWNER_SECRET_SYNC: Render deploy request failed with HTTP $deploy_code; response suppressed."
            exit 1
          fi
          deploy_id="$(jq -er '.id | strings' "$deploy_file" 2>/dev/null)" || {
            echo "::error::RENDER_OWNER_SECRET_SYNC: Render deploy response lacked an ID; response suppressed."
            exit 1
          }
          unset deploy_code

          live=false
          for attempt in $(seq 1 48); do
            poll_code="$(curl --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' \
              -o "$deploy_file" -w '%{http_code}' "$api/deploys/$deploy_id")"
            if [[ "$poll_code" != "200" ]]; then
              echo "::error::RENDER_OWNER_SECRET_SYNC: deploy status read failed with HTTP $poll_code; response suppressed."
              exit 1
            fi
            deploy_status="$(jq -r '.status // "unknown"' "$deploy_file")"
            case "$deploy_status" in
              live) live=true; break ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::RENDER_OWNER_SECRET_SYNC: Render deploy ended in status $deploy_status."
                exit 1
                ;;
            esac
            sleep 5
          done
          unset deploy_id
          if [[ "$live" != "true" ]]; then
            echo "::error::RENDER_OWNER_SECRET_SYNC: Render deploy did not reach live within the bounded 4-minute wait."
            exit 1
          fi
          echo "PASS: Render Python Core secret synchronized and deployment reached live; secret value suppressed."
      - name: Synchronize owner secret to the deployed Worker without logging it
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PYTHON_CORE_URL" | npx --yes wrangler@4 secret put PYTHON_CORE_URL --config central-agent/wrangler.jsonc
          printf '%s' "$REDULTRON_OWNER_SECRET" | npx --yes wrangler@4 secret put OWNER_SECRET --config central-agent/wrangler.jsonc
          echo "PASS: PYTHON_CORE_URL and OWNER_SECRET bindings synchronized; values were not printed."
      - name: Deploy exact GitHub commit provenance
        run: |
          npx --yes wrangler@4 deploy --config central-agent/wrangler.jsonc --var "GITHUB_COMMIT_SHA:$GITHUB_SHA"
      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$WORKER_URL/health")"
          test "$code" = "200"
          jq -e '.ok == true' "$body"
      - name: Verify Python Core health before execution probe
        shell: bash
        run: python3 hybrid-core/health_probe.py

      - name: Require actual authenticated Python hybrid execution
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          code="$(curl --silent --show-error --max-time 30 -X POST \
            -H "x-owner-secret: $REDULTRON_OWNER_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            -o "$body" -w '%{http_code}' "$WORKER_URL/api/internal/hybrid-probe")"
          if [[ "$code" != "200" ]]; then
            upstream_code="$(jq -r 'if type == "object" then (.code // .error // "UNKNOWN") | if type == "string" then gsub("[^A-Za-z0-9_-]"; "")[0:64] else "UNKNOWN" end else "UNKNOWN" end' "$body" 2>/dev/null || printf 'UNREADABLE_RESPONSE')"
            echo "::error::STRICT FAIL: probe endpoint returned HTTP $code; sanitized upstream code=$upstream_code."
            exit 1
          fi
          if ! jq -e '
            .ok == true and
            .probe == "authenticated-hybrid-roundtrip" and
            .task == "summarize" and
            .engine == "python-edge-hybrid" and
            .fallbackEngaged == false and
            (.resultSchemaValid == true or .resultsSchemaValid == true) and
            .hybridPythonCoreExecutionVerified == true
          ' "$body" >/dev/null; then
            jq -c '{
              ok: (if (.ok | type) == "boolean" then .ok else "UNKNOWN" end),
              probe: (if (.probe | type) == "string" then (.probe | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              probeTask: (if (.task | type) == "string" then (.task | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              engine: (if (.engine | type) == "string" then (.engine | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              fallbackEngaged: (if (.fallbackEngaged | type) == "boolean" then .fallbackEngaged else "UNKNOWN" end),
              fallbackReason: (if (.fallbackReason | type) == "string" then (.fallbackReason | gsub("[^A-Za-z0-9_-]"; "")[0:64]) else "UNKNOWN" end),
              hybridPythonCoreExecutionVerified: (if (.hybridPythonCoreExecutionVerified | type) == "boolean" then .hybridPythonCoreExecutionVerified else "UNKNOWN" end),
              resultType: (.result | type)
            }' "$body" 2>/dev/null || echo "STRICT FAIL: response was not valid JSON; body suppressed."
            exit 1
          fi
          echo "PASS: strict authenticated Python hybrid execution and response schema verified."
