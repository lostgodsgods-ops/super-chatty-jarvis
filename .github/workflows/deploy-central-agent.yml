name: Deploy Central Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "central-agent/**"
      - "jarvis/**"
      - "sw.js"
      - ".github/workflows/deploy-central-agent.yml"

permissions:
  contents: read

concurrency:
  group: super-chatty-central-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run policy and owner-auth tests
        run: node --test central-agent/policy.test.mjs central-agent/owner-auth.test.mjs central-agent/bootstrap-owner.test.mjs central-agent/internal-search.test.mjs central-agent/patch-passkey-staging.test.mjs central-agent/task-queue.test.mjs central-agent/current-info-query.test.mjs central-agent/architecture/integration-registry.test.mjs central-agent/architecture/goal-lifecycle.test.mjs central-agent/research-agents.test.mjs

      - name: Validate required secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
          SEARCH_KEY: ${{ secrets.SEARCH_API_KEY }}
          BRIDGE_TOKEN: ${{ secrets.AGENT_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SETUP_TOKEN" || { echo "Missing OWNER_SETUP_TOKEN"; exit 1; }
          test -n "$SEARCH_KEY" || { echo "Missing SEARCH_API_KEY"; exit 1; }
          test -n "$BRIDGE_TOKEN" || { echo "Missing AGENT_GATEWAY_TOKEN"; exit 1; }
          echo "Required secret values are present (values not displayed)."

      - name: Deploy isolated Central Agent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config central-agent/wrangler.jsonc

      - name: Verify public PWA asset routing and service-worker script
        shell: bash
        env:
          PWA_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_asset() {
            local path="$1" output="$2" headers="$3" expected_type="$4"
            local status content_type
            status="$(curl --silent --show-error --location --max-redirs 4 --max-time 20 -D "$headers" -o "$output" -w '%{http_code}' "$PWA_URL$path")"
            test "$status" = "200" || { echo "::error::GET $path returned HTTP $status"; exit 1; }
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); value=tolower($0)} END{print value}' "$headers" | tail -n 1)"
            case "$content_type" in
              *"$expected_type"*) ;;
              *) echo "::error::GET $path had unexpected Content-Type: $content_type"; exit 1 ;;
            esac
          }

          fetch_asset "/" "$tmp/index.html" "$tmp/root.headers" "text/html"
          grep -Fq 'Super Chatty Jarvis · Neural Console' "$tmp/index.html"

          fetch_asset "/sw.js" "$tmp/sw-root.js" "$tmp/sw-root.headers" "application/javascript"
          grep -Fq 'super-chatty-jarvis-shell-v1' "$tmp/sw-root.js"

          fetch_asset "/jarvis/sw.js" "$tmp/sw-subpath.js" "$tmp/sw-subpath.headers" "application/javascript"
          grep -Fq 'super-chatty-jarvis-shell-v1' "$tmp/sw-subpath.js"

          fetch_asset "/manifest.webmanifest" "$tmp/manifest.json" "$tmp/manifest.headers" "application/manifest+json"
          node -e 'const m=require(process.argv[1]); if(m.name!=="Super Chatty Jarvis"||m.scope!=="./") throw Error("PWA manifest identity/scope mismatch");' "$tmp/manifest.json"

          code="$(curl --silent --show-error --max-time 15 -o "$tmp/health.json" -w '%{http_code}' "$PWA_URL/health")"
          test "$code" = "200" || { echo "::error::/health returned HTTP $code"; exit 1; }
          node -e 'const h=require(process.argv[1]); if(h.ok!==true) throw Error("Worker health is not ok");' "$tmp/health.json"

          echo "PWA asset routing PASS: root HTML, JavaScript MIME on both sw.js paths, manifest, and health verified."

      - name: Configure Worker runtime secrets in one operation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          AGENT_GATEWAY_TOKEN: ${{ secrets.AGENT_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          node - "$secrets_file" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const payload = {
            OWNER_SETUP_TOKEN: process.env.OWNER_SETUP_TOKEN,
            SEARCH_API_KEY: process.env.SEARCH_API_KEY,
            SEARCH_BRIDGE_TOKEN: process.env.AGENT_GATEWAY_TOKEN,
          };
          if (!payload.OWNER_SETUP_TOKEN || !payload.SEARCH_API_KEY || !payload.SEARCH_BRIDGE_TOKEN) {
            throw new Error("Required Worker secret values are missing.");
          }
          fs.writeFileSync(path, JSON.stringify(payload), { mode: 0o600 });
          NODE
          npx --yes wrangler@4 secret bulk "$secrets_file" --config central-agent/wrangler.jsonc
          sleep 5

      - name: Verify central Tavily gateway bindings
        shell: bash
        env:
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl --silent --show-error --max-time 15 --output "$tmp" --write-out '%{http_code}' "$CENTRAL_AGENT_URL/health")"
          test "$code" = "200" || { echo "::error::Central Agent health failed with HTTP $code"; exit 1; }
          node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.ok!==true||x.capabilities?.tavilySearchConfigured!==true||x.capabilities?.gatewaySearchConfigured!==true) throw Error("Central Tavily gateway is not configured"); console.log(JSON.stringify({ok:x.ok,tavilySearchConfigured:x.capabilities.tavilySearchConfigured,gatewaySearchConfigured:x.capabilities.gatewaySearchConfigured}));' "$tmp"

      - name: Initialize owner password when needed
        shell: bash
        env:
          OWNER_SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
          OWNER_PASSWORD: ${{ secrets.CENTRAL_AGENT_OWNER_PASSWORD }}
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          node central-agent/bootstrap-owner.mjs

      - name: Deploy staging PWA chat and Tavily proxy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_GATEWAY_TOKEN: ${{ secrets.AGENT_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          node central-agent/patch-passkey-staging.mjs

      - name: Verify authenticated research telemetry
        shell: bash
        env:
          OWNER_PASSWORD: ${{ secrets.CENTRAL_AGENT_OWNER_PASSWORD }}
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgods.workers.dev
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.CENTRAL_AGENT_URL;
          const password = process.env.OWNER_PASSWORD;
          if (!password) throw new Error("Missing CENTRAL_AGENT_OWNER_PASSWORD.");
          const loginResponse = await fetch(`${base}/auth/login`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ password }),
            cache: "no-store"
          });
          if (!loginResponse.ok) throw new Error(`Owner login failed: HTTP ${loginResponse.status}`);
          const login = await loginResponse.json();
          const token = login?.token;
          if (typeof token !== "string" || !token) throw new Error("Owner login returned no session token.");
          try {
            const sessionResponse = await fetch(`${base}/auth/session`, {
              headers: { authorization: `Bearer ${token}` },
              cache: "no-store"
            });
            if (!sessionResponse.ok) throw new Error(`Owner session verification failed: HTTP ${sessionResponse.status}`);
            const session = await sessionResponse.json();
            if (session.authenticated !== true) throw new Error("Owner session was not authenticated.");
            const statusResponse = await fetch(`${base}/research/status`, {
              headers: { authorization: `Bearer ${token}` },
              cache: "no-store"
            });
            if (!statusResponse.ok) throw new Error(`Authenticated research status failed: HTTP ${statusResponse.status}`);
            const telemetry = await statusResponse.json();
            if (telemetry.ok !== true || telemetry.enabled !== true || telemetry.initialized !== true ||
                !telemetry.lastRun || !Array.isArray(telemetry.sentiment) || !Array.isArray(telemetry.signals)) {
              throw new Error("Authenticated research status payload failed schema checks.");
            }
            console.log(JSON.stringify({
              authenticated: true,
              researchStatus: "PASS",
              initialized: telemetry.initialized,
              latestRunStatus: telemetry.lastRun.status,
              latestRunErrorCount: telemetry.lastRun.errorCount,
              sentimentGroups: telemetry.sentiment.length,
              signalsReturned: telemetry.signals.length
            }));
          } finally {
            await fetch(`${base}/auth/logout`, {
              method: "POST",
              headers: { authorization: `Bearer ${token}` },
              cache: "no-store"
            }).catch(() => {});
          }
          NODE

