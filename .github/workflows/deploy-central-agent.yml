name: Deploy Central Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "central-agent/**"
      - "jarvis/**"
      - "src/worker.mjs"
      - "central-agent/wrangler.jsonc"
      - ".github/workflows/deploy-central-agent.yml"

permissions:
  contents: read

concurrency:
  group: super-chatty-central-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run full repository test suite including Hybrid Core
        run: |
          node --test central-agent/architecture/hybrid-core.test.mjs
          npm test

      - name: Validate required secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
          SEARCH_KEY: ${{ secrets.SEARCH_API_KEY }}
          BRIDGE_TOKEN: ${{ secrets.AGENT_GATEWAY_TOKEN }}
          PYTHON_CORE_URL: ${{ secrets.PYTHON_CORE_URL }}
          OWNER_SECRET: ${{ secrets.OWNER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SETUP_TOKEN" || { echo "Missing OWNER_SETUP_TOKEN"; exit 1; }
          echo "SEARCH_API_KEY is optional; direct DuckDuckGo search is the fallback."
          test -n "$BRIDGE_TOKEN" || { echo "Missing AGENT_GATEWAY_TOKEN"; exit 1; }
          test -n "$PYTHON_CORE_URL" || { echo "Missing PYTHON_CORE_URL"; exit 1; }
          test -n "$OWNER_SECRET" || { echo "Missing OWNER_SECRET"; exit 1; }
          node -e 'const u=new URL(process.env.PYTHON_CORE_URL); if(u.protocol!=="https:"||u.username||u.password||u.search||u.hash) process.exit(2); console.log("Hybrid Core secrets present; URL is HTTPS. Values are not printed.")'

      - name: Deploy isolated Central Agent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config central-agent/wrangler.jsonc

      - name: Verify public PWA asset routing and service-worker script
        shell: bash
        env:
          PWA_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_asset() {
            local path="$1" output="$2" headers="$3" expected_type="$4"
            local status content_type
            status="$(curl --silent --show-error --location --max-redirs 4 --max-time 20 -D "$headers" -o "$output" -w '%{http_code}' "$PWA_URL$path")"
            test "$status" = "200" || { echo "::error::GET $path returned HTTP $status"; exit 1; }
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); value=tolower($0)} END{print value}' "$headers" | tail -n 1)"
            case "$content_type" in
              *"$expected_type"*) ;;
              *) echo "::error::GET $path had unexpected Content-Type: $content_type"; exit 1 ;;
            esac
          }

          fetch_asset "/" "$tmp/index.html" "$tmp/root.headers" "text/html"
          grep -Fq 'REDULTRON CORE 2.0 · Neural Console' "$tmp/index.html"

          fetch_asset "/sw.js" "$tmp/sw-root.js" "$tmp/sw-root.headers" "application/javascript"
          expected_cache="$(grep -oE 'redultron-core-shell-v[0-9]+[^"]*' jarvis/sw.js | head -n 1)"
          test -n "$expected_cache" || { echo "::error::Could not read the expected PWA cache name from jarvis/sw.js"; exit 1; }
          grep -Fq "$expected_cache" "$tmp/sw-root.js" || { echo "::error::Root service worker cache name does not match repository source"; exit 1; }

          fetch_asset "/jarvis/sw.js" "$tmp/sw-subpath.js" "$tmp/sw-subpath.headers" "application/javascript"
          grep -Fq "$expected_cache" "$tmp/sw-subpath.js" || { echo "::error::Subpath service worker cache name does not match repository source"; exit 1; }

          fetch_asset "/manifest.webmanifest" "$tmp/manifest.json" "$tmp/manifest.headers" "application/manifest+json"
          node -e 'const m=require(process.argv[1]); if(m.name!=="REDULTRON CORE 2.0"||m.scope!=="./") throw Error("PWA manifest identity/scope mismatch");' "$tmp/manifest.json"
          fetch_asset "/icon-192.png" "$tmp/icon-192.png" "$tmp/icon-192.headers" "image/png"
          fetch_asset "/icon-512.png" "$tmp/icon-512.png" "$tmp/icon-512.headers" "image/png"
          node -e 'const m=require(process.argv[1]); for(const [size,name] of [[192,"icon-192.png"],[512,"icon-512.png"]]) if(!m.icons.some(i=>i.src==="./"+name&&i.sizes===size+"x"+size&&i.type==="image/png")) throw Error("Missing install icon: "+name);' "$tmp/manifest.json"

          code="$(curl --silent --show-error --max-time 15 -o "$tmp/health.json" -w '%{http_code}' "$PWA_URL/health")"
          test "$code" = "200" || { echo "::error::/health returned HTTP $code"; exit 1; }
          node -e 'const h=require(process.argv[1]); if(h.ok!==true) throw Error("Worker health is not ok"); if(h.capabilities?.boundedAgentExecutionConfigured!==true) throw Error("Bounded agent execution dependencies are not configured");' "$tmp/health.json"

          echo "PWA asset routing PASS: root HTML, JavaScript MIME on both sw.js paths, manifest, and health verified."

      - name: Configure Worker runtime secrets in one operation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AGENT_GATEWAY_TOKEN: ${{ secrets.AGENT_GATEWAY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHON_CORE_URL: ${{ secrets.PYTHON_CORE_URL }}
          OWNER_SECRET: ${{ secrets.OWNER_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          node - "$secrets_file" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const payload = {
            OWNER_SETUP_TOKEN: process.env.OWNER_SETUP_TOKEN,
            SEARCH_API_KEY: process.env.SEARCH_API_KEY || process.env.TAVILY_API_KEY || undefined,
            TAVILY_API_KEY: process.env.TAVILY_API_KEY || process.env.SEARCH_API_KEY || undefined,
            SEARCH_BRIDGE_TOKEN: process.env.AGENT_GATEWAY_TOKEN,
            PYTHON_CORE_URL: process.env.PYTHON_CORE_URL,
            OWNER_SECRET: process.env.OWNER_SECRET,
          };
          if (process.env.GEMINI_API_KEY) payload.GEMINI_API_KEY = process.env.GEMINI_API_KEY;
          if (!payload.OWNER_SETUP_TOKEN || !payload.SEARCH_BRIDGE_TOKEN || !payload.PYTHON_CORE_URL || !payload.OWNER_SECRET) {
            throw new Error("Required Worker secret values are missing.");
          }
          fs.writeFileSync(path, JSON.stringify(payload), { mode: 0o600 });
          NODE
          npx --yes wrangler@4 secret bulk "$secrets_file" --config central-agent/wrangler.jsonc
          sleep 5

      - name: Reapply canonical Worker config after secret binding updates
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config central-agent/wrangler.jsonc
          sleep 3

      - name: Verify central Tavily gateway bindings
        shell: bash
        env:
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl --silent --show-error --max-time 15 --output "$tmp" --write-out '%{http_code}' "$CENTRAL_AGENT_URL/health")"
          test "$code" = "200" || { echo "::error::Central Agent health failed with HTTP $code"; exit 1; }
          node - "$tmp" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const chain=x.capabilities?.liveSearchProviderChain;
          const requiredFallbacks=["duckduckgo-html","bing-news-rss","google-news-rss","gdelt-doc-api"];
          if(x.ok!==true||x.capabilities?.tavilySearchConfigured!==true||
             x.capabilities?.tavilySearchEnabled!==true||
             x.capabilities?.searchProviderMode!=="legacy-tavily-opt-in"||
             x.capabilities?.directWebSearchFallback!==true||
             x.capabilities?.gatewaySearchConfigured!==true||
             !Array.isArray(chain)||chain[0]!=="tavily"||
             !requiredFallbacks.every(p=>chain.includes(p))||
             x.capabilities?.searchProviderReachabilityChecked!==false) {
            throw new Error("Tavily-primary config is not active in the deployed Worker; refusing to certify search routing.");
          }
          console.log(JSON.stringify({
            ok:x.ok,
            searchProviderMode:x.capabilities.searchProviderMode,
            tavilySearchConfigured:x.capabilities.tavilySearchConfigured,
            tavilySearchEnabled:x.capabilities.tavilySearchEnabled,
            liveSearchProviderChain:chain,
            reachability:"pending authenticated query smoke test"
          }));
          NODE

      - name: Initialize owner password when needed
        shell: bash
        env:
          OWNER_SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
          OWNER_PASSWORD: ${{ secrets.CENTRAL_AGENT_OWNER_PASSWORD }}
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          node central-agent/bootstrap-owner.mjs

      - name: Verify authenticated Hybrid Core response and execution mode
        shell: bash
        env:
          OWNER_PASSWORD: ${{ secrets.CENTRAL_AGENT_OWNER_PASSWORD }}
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          test -n "$OWNER_PASSWORD" || { echo "::error::Missing CENTRAL_AGENT_OWNER_PASSWORD"; exit 1; }

          unauth_code="$(curl --silent --show-error --max-time 20 -X POST \
            -H 'content-type: application/json' --data '{"task":"classify_text","text":"unauthenticated probe"}' \
            -D "$tmp/unauth.headers" -o "$tmp/unauth.json" -w '%{http_code}' \
            "$CENTRAL_AGENT_URL/api/hybrid/execute")"
          test "$unauth_code" = "401" || { echo "::error::Hybrid route did not reject unauthenticated access (HTTP $unauth_code)"; exit 1; }

          node -e 'process.stdout.write(JSON.stringify({password:process.env.OWNER_PASSWORD}))' > "$tmp/login-request.json"
          login_code="$(curl --silent --show-error --max-time 20 -H 'content-type: application/json' \
            --data-binary "@$tmp/login-request.json" -o "$tmp/login.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/auth/login")"
          test "$login_code" = "200" || { echo "::error::Owner login failed: HTTP $login_code"; exit 1; }
          token="$(node -e 'const x=require(process.argv[1]); if(typeof x.token!=="string"||!x.token) process.exit(1); process.stdout.write(x.token)' "$tmp/login.json")"

          node -e 'process.stdout.write(JSON.stringify({task:"classify_text",text:"REDULTRON authenticated hybrid verification"}))' > "$tmp/hybrid-request.json"
          set +e
          curl --silent --show-error --max-time 15 -X POST \
            -H "Authorization: Bearer $token" -H 'content-type: application/json' \
            --data-binary "@$tmp/hybrid-request.json" -D "$tmp/hybrid.headers" \
            -o "$tmp/hybrid.json" -w 'HTTP_CODE=%{http_code}\n' "$CENTRAL_AGENT_URL/api/hybrid/execute"
          curl_exit=$?
          set -e
          echo "CURL_EXIT_CODE=$curl_exit"
          grep -iE '^(cf-ray|content-type):' "$tmp/hybrid.headers" | tr -d '\r' || true
          test "$curl_exit" -eq 0 || { echo "::error::Hybrid HTTP transport failed with curl exit $curl_exit"; exit 1; }
          node - "$tmp/hybrid.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(x.ok!==true||x.task!=="classify_text"||!x.result||typeof x.result!=="object"||
             x.resultSchemaValid!==true||x.resultsSchemaValid!==true) {
            console.error(JSON.stringify({ok:x.ok,code:x.code||null,error:x.error||null,engine:x.engine||null,task:x.task||null,resultSchemaValid:x.resultSchemaValid||false,resultsSchemaValid:x.resultsSchemaValid||false}));
            throw new Error("Authenticated Hybrid Core response failed schema validation.");
          }
          if(x.engine==="python-edge-hybrid" && x.fallbackEngaged!==true && x.hybridPythonCoreExecutionVerified===true) {
            console.log(JSON.stringify({hybridRoundTrip:"PASS",ownerAuth:"PASS",engine:x.engine,pythonExecutionVerified:true}));
          } else if(x.engine==="guarded-local-fallback" && x.fallbackEngaged===true && x.hybridPythonCoreExecutionVerified===false) {
            console.log(JSON.stringify({hybridRoute:"PASS",ownerAuth:"PASS",engine:x.engine,pythonExecutionVerified:false,fallbackReason:x.fallbackReason||"UNSPECIFIED"}));
            console.log("NOTICE: guarded fallback keeps the route available; this is not a Python execution pass.");
          } else {
            throw new Error("Hybrid execution mode flags are inconsistent.");
          }
          NODE
          echo "Hybrid Core response and schema verification PASS; no Owner token or secret was printed."
          curl --silent --show-error --max-time 15 -X POST -H "Authorization: Bearer $token" -o /dev/null "$CENTRAL_AGENT_URL/auth/logout" || true

      - name: Deploy staging PWA chat and Tavily proxy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_GATEWAY_TOKEN: ${{ secrets.AGENT_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          node central-agent/patch-passkey-staging.mjs

      - name: Verify authenticated live-search and WebAuthn challenge generation
        shell: bash
        env:
          OWNER_PASSWORD: ${{ secrets.CENTRAL_AGENT_OWNER_PASSWORD }}
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          test -n "$OWNER_PASSWORD" || { echo "::error::Missing CENTRAL_AGENT_OWNER_PASSWORD"; exit 1; }

          unauth_code="$(curl --silent --show-error --max-time 20 -H 'content-type: application/json' \
            -d '{"message":"What is the latest news about NASA Artemis today?"}' \
            -o "$tmp/unauth-chat.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/api/chat")"
          test "$unauth_code" = "401" || { echo "::error::Unauthenticated /api/chat should return HTTP 401, got $unauth_code"; cat "$tmp/unauth-chat.json"; exit 1; }

          node -e 'process.stdout.write(JSON.stringify({password:process.env.OWNER_PASSWORD}))' > "$tmp/login.json"
          login_code="$(curl --silent --show-error --max-time 20 -H 'content-type: application/json' \
            --data-binary "@$tmp/login.json" -o "$tmp/login-response.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/auth/login")"
          test "$login_code" = "200" || { echo "::error::Owner login failed: HTTP $login_code"; exit 1; }
          token="$(node -e 'const x=require(process.argv[1]); if(typeof x.token!=="string"||!x.token) process.exit(1); process.stdout.write(x.token)' "$tmp/login-response.json")"

          node -e 'process.stdout.write(JSON.stringify({message:"What is the latest news about NASA Artemis today?",language:"en-US"}))' > "$tmp/chat-request.json"
          chat_code="$(curl --silent --show-error --max-time 35 -H "Authorization: Bearer $token" -H 'content-type: application/json' \
            --data-binary "@$tmp/chat-request.json" -o "$tmp/chat-response.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/api/chat")"
          if [ "$chat_code" != "200" ]; then
            echo "::error::Authenticated live-search chat failed: HTTP $chat_code"
            node - "$tmp/chat-response.json" <<'NODE'
          const fs=require("node:fs");
          let x={};
          try { x=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); } catch {}
          console.error(JSON.stringify({
            code:x.code || "UNKNOWN_ERROR",
            error:x.error || "No error message returned",
            providers:Array.isArray(x.providers)?x.providers:[],
            diagnosticContractPresent:Array.isArray(x.providers)
          }));
          if(!Array.isArray(x.providers)) {
            console.error("Live-search failure response omitted provider diagnostics; verify that the latest Central Agent Worker version is deployed.");
          }
          NODE
            exit 1
          fi
          node - "$tmp/chat-response.json" "$tmp/search-gate.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const sourceUrlsValid=Array.isArray(x.sources)&&x.sources.length>0&&x.sources.every(s=>typeof s.url==="string"&&/^https?:\/\//.test(s.url));
          const searchProvider=typeof x.core?.searchProvider==="string"?x.core.searchProvider:"";
          const normalizedProvider=searchProvider.replace(/^agent-saum\//,"");
          const supportedProviders=new Set(["tavily","duckduckgo-html","bing-news-rss","google-news-rss","gdelt-doc-api","wikipedia-api"]);
          const providerAllowed=supportedProviders.has(normalizedProvider);
          const providerMatches=x.provider===searchProvider+"+workers-ai";
          const liveSearchOk=x.ok===true&&x.core?.webSearchExecuted===true&&providerAllowed&&providerMatches&&sourceUrlsValid;
          const tavilyPrimary=liveSearchOk&&normalizedProvider==="tavily";
          if(!liveSearchOk) {
            console.error(JSON.stringify({
              ok:x.ok===true, provider:typeof x.provider==="string"?x.provider:null, searchProvider,
              webSearchExecuted:x.core?.webSearchExecuted===true, providerAllowed, providerMatches,
              sourceCount:Array.isArray(x.sources)?x.sources.length:0, sourceUrlsValid,
              code:typeof x.code==="string"?x.code:null
            }));
            throw new Error("Authenticated live-search smoke test did not verify a supported live provider with valid source URLs.");
          }
          require("node:fs").writeFileSync(process.argv[3], JSON.stringify({tavilyPrimary, searchProvider, provider:x.provider}));
          console.log(JSON.stringify({
            authenticatedChat:"PASS", liveSearch:"PASS", provider:x.provider, searchProvider,
            tavilyPrimary:tavilyPrimary?"PASS":"DEGRADED_FALLBACK",
            sourceCount:x.sources.length, sourceUrlsValid:true
          }));
          if(!tavilyPrimary) console.error("Tavily-primary verification is degraded; fallback returned valid sources. The strict deployment gate will still fail after independent WebAuthn verification.");
          NODE

          node -e 'process.stdout.write(JSON.stringify({}))' > "$tmp/passkey-request.json"
          passkey_code="$(curl --silent --show-error --max-time 20 -X POST -H "Authorization: Bearer $token" \
            -H 'Origin: https://shrill-silence-164f.lostgodsgods.workers.dev' -H 'content-type: application/json' \
            --data-binary "@$tmp/passkey-request.json" -o "$tmp/passkey-options.json" -w '%{http_code}' \
            "$CENTRAL_AGENT_URL/auth/passkey/register/options")"
          test "$passkey_code" = "200" || { echo "::error::Passkey registration challenge options failed: HTTP $passkey_code"; cat "$tmp/passkey-options.json"; exit 1; }
          node - "$tmp/passkey-options.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(typeof x.challenge!=="string"||x.challenge.length<20||x.rp?.id!=="shrill-silence-164f.lostgodsgods.workers.dev"||
             x.user?.name!=="loss-gods"||!Array.isArray(x.pubKeyCredParams)) {
            throw new Error("WebAuthn registration options failed challenge/origin/RP schema verification.");
          }
          console.log(JSON.stringify({passkeyChallenge:"PASS",originBinding:"PASS",rpId:x.rp.id}));
          NODE

          echo "Authenticated live-search chain and WebAuthn challenge checks completed; Tavily status is evaluated separately."
          curl --silent --show-error --max-time 20 -X POST -H "Authorization: Bearer $token" \
            -o /dev/null "$CENTRAL_AGENT_URL/auth/logout" || true
          tavily_primary="$(node -e 'const x=require(process.argv[1]); process.stdout.write(x.tavilyPrimary ? "yes" : "no")' "$tmp/search-gate.json")"
          if [ "$tavily_primary" != "yes" ]; then
            echo "::error::Tavily-primary verification failed. A supported live fallback worked, but Tavily itself remains degraded."
            exit 1
          fi

      - name: Verify authenticated research telemetry
        shell: bash
        env:
          OWNER_PASSWORD: ${{ secrets.CENTRAL_AGENT_OWNER_PASSWORD }}
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          test -n "$OWNER_PASSWORD" || { echo "::error::Missing CENTRAL_AGENT_OWNER_PASSWORD"; exit 1; }

          node -e 'process.stdout.write(JSON.stringify({password: process.env.OWNER_PASSWORD}))' > "$tmp/login-request.json"
          login_code="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 --max-time 20 \
            -H 'content-type: application/json' --data-binary "@$tmp/login-request.json" \
            -o "$tmp/login.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/auth/login")"
          test "$login_code" = "200" || { echo "::error::Owner login failed: HTTP $login_code"; exit 1; }
          token="$(node -e 'const x=require(process.argv[1]); if(typeof x.token!=="string"||!x.token) process.exit(1); process.stdout.write(x.token)' "$tmp/login.json")"

          session_code="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 --max-time 20 \
            -H "Authorization: Bearer $token" -o "$tmp/session.json" -w '%{http_code}' \
            "$CENTRAL_AGENT_URL/auth/session")"
          test "$session_code" = "200" || { echo "::error::Owner session verification failed: HTTP $session_code"; exit 1; }
          node -e 'const x=require(process.argv[1]); if(x.authenticated!==true) process.exit(1)' "$tmp/session.json"

          status_code="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 --max-time 20 \
            -H "Authorization: Bearer $token" -o "$tmp/research-status.json" -w '%{http_code}' \
            "$CENTRAL_AGENT_URL/research/status")"
          test "$status_code" = "200" || { echo "::error::Authenticated research status failed: HTTP $status_code"; exit 1; }
          node - "$tmp/research-status.json" <<'NODE'
          const fs = require("node:fs");
          const telemetry = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (telemetry.ok !== true || telemetry.enabled !== true || telemetry.initialized !== true ||
              !telemetry.lastRun || !Array.isArray(telemetry.sentiment) || !Array.isArray(telemetry.signals)) {
            throw new Error("Authenticated research status payload failed schema checks.");
          }
          console.log(JSON.stringify({
            authenticated: true,
            researchStatus: "PASS",
            initialized: telemetry.initialized,
            latestRunStatus: telemetry.lastRun.status,
            latestRunErrorCount: telemetry.lastRun.errorCount,
            sentimentGroups: telemetry.sentiment.length,
            signalsReturned: telemetry.signals.length
          }));
          NODE

          node -e 'process.stdout.write(JSON.stringify({session_id:"owner-global",memory_type:"deployment_probe",state:{deploymentRun:process.env.GITHUB_RUN_ID,verifiedAt:new Date().toISOString()}}))' > "$tmp/memory-write.json"
          write_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" \
            -H 'content-type: application/json' --data-binary "@$tmp/memory-write.json" \
            -o "$tmp/memory-write-response.json" -w '%{http_code}' -X POST "$CENTRAL_AGENT_URL/api/memory")"
          test "$write_code" = "200" || { echo "::error::D1 memory write failed: HTTP $write_code"; exit 1; }

          read_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" \
            -o "$tmp/memory-read.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/api/memory?session_id=owner-global")"
          test "$read_code" = "200" || { echo "::error::D1 memory read failed: HTTP $read_code"; exit 1; }
          node - "$tmp/memory-write-response.json" "$tmp/memory-read.json" <<'NODE'
          const fs = require("node:fs");
          const write = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const read = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const found = (read.memories || []).find(item =>
            item.memory_type === "deployment_probe" &&
            item.state?.deploymentRun === process.env.GITHUB_RUN_ID
          );
          if (write.ok !== true || !found) throw new Error("D1 memory write/read-back verification failed.");
          console.log(JSON.stringify({ memoryBridge: "PASS", writeConfirmed: write.ok, readBackConfirmed: true }));
          NODE

          node -e 'process.stdout.write(JSON.stringify({role:"testing",input:"Review a simple JSON API handler for input validation. Return a concise test plan; do not execute external actions."}))' > "$tmp/agent-request.json"
          agent_code="$(curl --silent --show-error --max-time 25 -H "Authorization: Bearer $token" \
            -H 'content-type: application/json' --data-binary "@$tmp/agent-request.json" \
            -o "$tmp/agent-response.json" -w '%{http_code}' -X POST "$CENTRAL_AGENT_URL/agents")"
          if [ "$agent_code" = "200" ]; then
            agent_id="$(node -e 'const x=require(process.argv[1]); if(x.ok!==true||!x.outcomes?.[0]?.id||x.outcomes[0].status!=="completed") process.exit(1); process.stdout.write(x.outcomes[0].id)' "$tmp/agent-response.json")"
            agent_session="agent-run-$agent_id"
            agent_memory_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" \
              -o "$tmp/agent-memory.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/api/memory?session_id=$agent_session")"
            test "$agent_memory_code" = "200" || { echo "::error::Agent memory read failed: HTTP $agent_memory_code"; exit 1; }
            node - "$tmp/agent-response.json" "$tmp/agent-memory.json" <<'NODE'
          const fs = require("node:fs");
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8")).outcomes[0];
          const memory = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const saved = (memory.memories || []).find(item => item.memory_type === "agent_run" && item.state?.runId === run.id);
          if (run.status !== "completed" || !saved) throw new Error("Dynamic agent run or durable memory verification failed.");
          console.log(JSON.stringify({ dynamicAgent: "PASS", role: run.role, runId: run.id, durableMemory: "PASS" }));
          NODE
          elif [ "$agent_code" = "207" ]; then
            node - "$tmp/agent-response.json" <<'NODE'
          const fs = require("node:fs");
          const x = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log(JSON.stringify({quotaProbeStatus:x.status,outcomeStatus:x.outcomes?.[0]?.status,error:x.outcomes?.[0]?.error,hasAuditId:!!x.outcomes?.[0]?.id}));
          if (x.ok !== false || !Array.isArray(x.outcomes) || x.outcomes.length !== 1 ||
              x.outcomes[0].status !== "failed" || !/^AI_QUOTA_EXHAUSTED(?:_BACKUP_UNAVAILABLE)?$/.test(x.outcomes[0].error || "")) throw new Error("HTTP 207 was not the explicitly recognized AI quota-only degradation.");
          console.log(JSON.stringify({ dynamicAgent: "DEGRADED_BY_PROVIDER_QUOTA", quotaFallback: "NOT_CONFIGURED", durableAuditExpected: true }));
          NODE
            echo "Quota-limited agent probe recorded as degraded; continuing independent D1/KV Sentinel verification."
          else
            echo "::error::Agent runner returned unexpected HTTP $agent_code"; cat "$tmp/agent-response.json"; exit 1
          fi

          sentinel_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" \
            -o "$tmp/sentinel-run.json" -w '%{http_code}' -X POST "$CENTRAL_AGENT_URL/sentinel/run")"
          test "$sentinel_code" = "200" || { echo "::error::Sentinel probe returned HTTP $sentinel_code"; cat "$tmp/sentinel-run.json"; exit 1; }
          node - "$tmp/sentinel-run.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(x.ok!==true||x.status!=="healthy"||x.metrics?.d1?.ok!==true) throw new Error("Sentinel D1 authoritative readiness probe is not healthy.");
          if(x.metrics?.storageMode!=="d1-authoritative"||("archive" in x.metrics)) throw new Error("Sentinel storage mode does not match the D1-authoritative, R2-free architecture.");
          const kv=x.metrics?.kv;
          if(!kv||typeof kv.checked!=="boolean") throw new Error("Sentinel KV status is missing or malformed.");
          if(kv.checked===true && kv.ok!==true) throw new Error("Sentinel reports a failed KV probe.");
          if(kv.checked===false && typeof kv.reason!=="string") throw new Error("Sentinel omitted the reason KV is excluded from readiness.");
          console.log(JSON.stringify({sentinel:"PASS",storageMode:"d1-authoritative",d1:"PASS",kv:kv.checked?(kv.ok?"PASS":"FAIL"):"NON_CRITICAL_NOT_PROBED",kvReason:kv.reason||null,r2Dependency:"NONE"}));
          NODE

          status_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" \
            -o "$tmp/sentinel-status.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/sentinel/status")"
          test "$status_code" = "200" || { echo "::error::Sentinel status read failed: HTTP $status_code"; exit 1; }
          node - "$tmp/sentinel-status.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(x.ok!==true||!Array.isArray(x.runs)||!x.runs.some(run=>run.status==="healthy")) throw new Error("Sentinel audit readback failed.");
          console.log(JSON.stringify({sentinelAudit:"PASS",records:x.runs.length}));
          NODE

          OWNER_TOKEN="$token" node - <<'NODE'
          (async () => {
            const base=process.env.CENTRAL_AGENT_URL;
            const token=process.env.OWNER_TOKEN;
            const controller=new AbortController();
            const response=await fetch(base+"/events",{headers:{authorization:"Bearer "+token,accept:"text/event-stream"},signal:controller.signal});
            if(response.status!==200||!response.headers.get("content-type")?.includes("text/event-stream")) throw new Error("SSE endpoint did not return an authenticated event stream.");
            const reader=response.body.getReader(), decoder=new TextDecoder();
            let buffer="", found=false;
            for(let i=0;i<6&&!found;i++){
              const chunk=await reader.read(); if(chunk.done) break;
              buffer+=decoder.decode(chunk.value,{stream:true});
              if(buffer.includes("event: status")&&buffer.includes("data:")) found=true;
            }
            await reader.cancel(); controller.abort();
            if(!found) throw new Error("SSE did not deliver a Sentinel status event.");
            console.log(JSON.stringify({authenticatedSSE:"PASS"}));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

          owner_control_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" -o "$tmp/owner-control.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/api/owner-control")"
          test "$owner_control_code" = "200" || { echo "::error::Owner Control live status failed: HTTP $owner_control_code"; exit 1; }
          node - "$tmp/owner-control.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(x.ok!==true||!x.state||!["normal","owner-takeover","emergency-stop"].includes(x.state.mode)||x.audit?.recorded!==true) throw new Error("Owner Control response/audit schema is invalid.");
          console.log(JSON.stringify({ownerControlLive:"PASS",mode:x.state.mode,revision:x.state.revision,audit:"PASS"}));
          NODE

          finance_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" -o "$tmp/finance-before.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/api/finance/sandbox")"
          test "$finance_code" = "200" || { echo "::error::Finance sandbox live read failed: HTTP $finance_code"; exit 1; }
          node - "$tmp/finance-before.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(x.ok!==true||x.ledger?.mode!=="simulation-only"||x.ledger?.livePaymentsEnabled!==false||!Number.isSafeInteger(x.ledger?.balanceMinor)) throw new Error("Finance sandbox safety schema is invalid.");
          console.log(JSON.stringify({financeSandboxLive:"PASS",mode:x.ledger.mode,livePaymentsEnabled:x.ledger.livePaymentsEnabled,revision:x.revision}));
          NODE

          node -e 'process.stdout.write(JSON.stringify({action:"status"}))' > "$tmp/robotics-status-request.json"
          robotics_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" -H 'content-type: application/json' --data-binary "@$tmp/robotics-status-request.json" -o "$tmp/robotics-status.json" -w '%{http_code}' -X POST "$CENTRAL_AGENT_URL/api/robotics/simulator/assess")"
          test "$robotics_code" = "200" || { echo "::error::Robotics simulator status assessment failed: HTTP $robotics_code"; cat "$tmp/robotics-status.json"; exit 1; }
          node - "$tmp/robotics-status.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(x.ok!==true||x.assessment?.executionMode!=="simulation-only"||x.assessment?.sideEffectsExecuted!==false||x.audit?.recorded!==true) throw new Error("Robotics simulator safety schema is invalid.");
          console.log(JSON.stringify({roboticsSimulatorLive:"PASS",executionMode:x.assessment.executionMode,sideEffectsExecuted:x.assessment.sideEffectsExecuted,audit:"PASS"}));
          NODE

          node -e 'process.stdout.write(JSON.stringify({idempotencyKey:"live-payment-smoke-denied",kind:"credit",amountMinor:1,livePayment:true}))' > "$tmp/live-payment-denial.json"
          live_payment_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" -H 'content-type: application/json' --data-binary "@$tmp/live-payment-denial.json" -o "$tmp/live-payment-denial-response.json" -w '%{http_code}' -X POST "$CENTRAL_AGENT_URL/api/finance/sandbox")"
          test "$live_payment_code" = "400" || { echo "::error::Finance sandbox did not deny a live-payment request (HTTP $live_payment_code)"; exit 1; }
          node - "$tmp/live-payment-denial-response.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(x.error!=="LIVE_PAYMENTS_DISABLED") throw new Error("Live-payment denial returned an unexpected result.");
          console.log(JSON.stringify({livePayment:"DENIED",simulationBoundary:"PASS"}));
          NODE

          finance_after_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" -o "$tmp/finance-after.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/api/finance/sandbox")"
          test "$finance_after_code" = "200" || { echo "::error::Finance sandbox readback failed: HTTP $finance_after_code"; exit 1; }
          node - "$tmp/finance-before.json" "$tmp/finance-after.json" <<'NODE'
          const fs=require("node:fs");
          const before=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const after=JSON.parse(fs.readFileSync(process.argv[3],"utf8"));
          if(before.revision!==after.revision||before.ledger.balanceMinor!==after.ledger.balanceMinor) throw new Error("Rejected live-payment attempt changed the simulation ledger.");
          console.log(JSON.stringify({financeLedgerReadback:"PASS",rejectedPaymentMutation:"NONE"}));
          NODE

          # Verify the actual bounded agent runner, not just its registry or deployment.
          node -e 'process.stdout.write(JSON.stringify({role:"testing",input:"Verify the owner-authenticated bounded agent execution path. Return a small test plan."}))' > "$tmp/agent-run-request.json"
          unauth_agent_code="$(curl --silent --show-error --max-time 20 -H 'content-type: application/json' --data-binary "@$tmp/agent-run-request.json" -o "$tmp/agent-unauth.json" -w '%{http_code}' -X POST "$CENTRAL_AGENT_URL/agents")"
          test "$unauth_agent_code" = "401" || { echo "::error::Unauthenticated /agents request must be denied, got HTTP $unauth_agent_code"; exit 1; }

          agent_code="$(curl --silent --show-error --max-time 35 -H "Authorization: Bearer $token" -H 'content-type: application/json' --data-binary "@$tmp/agent-run-request.json" -o "$tmp/agent-run-response.json" -w '%{http_code}' -X POST "$CENTRAL_AGENT_URL/agents")"
          test "$agent_code" = "200" || { echo "::error::Authenticated bounded agent execution failed: HTTP $agent_code"; cat "$tmp/agent-run-response.json"; exit 1; }
          node - "$tmp/agent-run-response.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const run=x.outcomes?.[0];
          if(x.ok!==true||run?.ok!==true||run.role!=="testing"||run.status!=="completed"||!run.result||run.result.notExecuted!==true) {
            throw new Error("Authenticated bounded agent runner did not complete with the expected safe result.");
          }
          console.log(JSON.stringify({ownerAuthEnforced:"PASS",boundedAgentExecution:"PASS",role:run.role,status:run.status,externalSideEffects:"NOT_EXECUTED"}));
          NODE

          agent_registry_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" -o "$tmp/agent-registry.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/agents?limit=1")"
          test "$agent_registry_code" = "200" || { echo "::error::Agent run audit readback failed: HTTP $agent_registry_code"; exit 1; }
          node - "$tmp/agent-registry.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(x.ok!==true||!Array.isArray(x.recentRuns)||!x.recentRuns.some(run=>run.role==="testing"&&run.status==="completed")) {
            throw new Error("Agent run did not appear in the persisted audit readback.");
          }
          console.log(JSON.stringify({agentRunAuditReadback:"PASS"}));
          NODE

          red_queen_code="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" -o "$tmp/red-queen-status.json" -w '%{http_code}' "$CENTRAL_AGENT_URL/api/red-queen/status")"
          test "$red_queen_code" = "200" || { echo "::error::Red Queen status registry failed: HTTP $red_queen_code"; exit 1; }
          node - "$tmp/red-queen-status.json" <<'NODE'
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const ids=new Set((x.registry?.platformModules||[]).map(m=>m.id));
          for(const id of ["owner-control","finance-sandbox","robotics-iot","voice","memory","security-sentinel"]) if(!ids.has(id)) throw new Error("Red Queen registry missing module: "+id);
          console.log(JSON.stringify({redQueenRegistry:"PASS",platformModules:ids.size,livePhysicalExecution:x.registry.livePhysicalExecution}));
          NODE

          curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 \
            -X POST -H "Authorization: Bearer $token" -o /dev/null "$CENTRAL_AGENT_URL/auth/logout" || true

