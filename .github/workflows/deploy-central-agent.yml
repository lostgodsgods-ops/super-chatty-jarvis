name: Deploy Central Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "central-agent/**"
      - ".github/workflows/deploy-central-agent.yml"

permissions:
  contents: read

concurrency:
  group: super-chatty-central-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run policy and owner-auth tests
        run: node --test central-agent/policy.test.mjs central-agent/owner-auth.test.mjs central-agent/bootstrap-owner.test.mjs central-agent/patch-passkey-staging.test.mjs

      - name: Validate required secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
          SEARCH_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SETUP_TOKEN" || { echo "Missing OWNER_SETUP_TOKEN"; exit 1; }
          test -n "$SEARCH_KEY" || { echo "Missing SEARCH_API_KEY"; exit 1; }
          test -n "$GATEWAY_TOKEN" || { echo "Missing AGENT_GATEWAY_TOKEN"; exit 1; }
          echo "Required secret values are present (values not displayed)."

      - name: Deploy isolated Central Agent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config central-agent/wrangler.jsonc

      - name: Configure Worker runtime secrets in one operation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          node - "$secrets_file" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const payload = {
            OWNER_SETUP_TOKEN: process.env.OWNER_SETUP_TOKEN,
            SEARCH_API_KEY: process.env.SEARCH_API_KEY,
            AGENT_GATEWAY_TOKEN: process.env.AGENT_GATEWAY_TOKEN
          };
          if (!payload.OWNER_SETUP_TOKEN || !payload.SEARCH_API_KEY || !payload.AGENT_GATEWAY_TOKEN) {
            throw new Error("Required Worker secret values are missing.");
          }
          fs.writeFileSync(path, JSON.stringify(payload), { mode: 0o600 });
          NODE
          npx --yes wrangler@4 secret bulk "$secrets_file" --config central-agent/wrangler.jsonc
          sleep 5

      - name: Verify protected central Tavily search gateway
        shell: bash
        env:
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
          AGENT_GATEWAY_TOKEN: ${{ secrets.AGENT_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AGENT_GATEWAY_TOKEN" || { echo "::error::Missing AGENT_GATEWAY_TOKEN"; exit 1; }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          health_code="$(curl --silent --show-error --max-time 15 --output "$tmp/health.json" --write-out '%{http_code}' "$CENTRAL_AGENT_URL/health")"
          test "$health_code" = "200" || { echo "::error::Central Agent health failed with HTTP $health_code"; exit 1; }
          node -e 'const x=require(process.argv[1]); if(x.ok!==true||x.capabilities?.tavilySearchConfigured!==true||x.capabilities?.gatewaySearchConfigured!==true) throw Error("Central Tavily gateway is not configured"); console.log(JSON.stringify({ok:x.ok,tavilySearchConfigured:x.capabilities.tavilySearchConfigured,gatewaySearchConfigured:x.capabilities.gatewaySearchConfigured}));' "$tmp/health.json"
          search_code="$(curl --silent --show-error --max-time 25 --output "$tmp/search.json" --write-out '%{http_code}' -H 'content-type: application/json' -H "authorization: Bearer $AGENT_GATEWAY_TOKEN" -X POST "$CENTRAL_AGENT_URL/internal/search" --data '{"query":"Cloudflare Workers health checks documentation","language":"en-IN"}')"
          unset AGENT_GATEWAY_TOKEN
          if [[ "$search_code" != "200" ]]; then
            echo "::error::Central Tavily gateway search failed with HTTP $search_code"
            node -e 'const x=require(process.argv[1]); console.log(JSON.stringify({error:x.error||"Live search failed",code:x.code||null}));' "$tmp/search.json"
            exit 1
          fi
          node -e 'const x=require(process.argv[1]); if(x.ok!==true||x.core?.webSearchExecuted!==true||x.core?.searchProvider!=="tavily"||!Array.isArray(x.sources)||x.sources.length<1) throw Error("Expected a successful protected Tavily search with at least one source"); if(x.sources.some(s=>typeof s.url!=="string"||!/^https?:\\/\\//i.test(s.url))) throw Error("Invalid source URL"); console.log(JSON.stringify({ok:x.ok,searchProvider:x.core.searchProvider,sourceCount:x.sources.length,synthesisMode:x.core.synthesisMode,sourceUrls:x.sources.map(s=>s.url)},null,2));' "$tmp/search.json"

      - name: Initialize owner password when needed
        shell: bash
        env:
          OWNER_SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
          OWNER_PASSWORD: ${{ secrets.CENTRAL_AGENT_OWNER_PASSWORD }}
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          node central-agent/bootstrap-owner.mjs
