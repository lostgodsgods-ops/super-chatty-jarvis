  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "central-agent/**"
      - ".github/workflows/deploy-central-agent.yml"

permissions:
  contents: read

concurrency:
  group: super-chatty-central-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

