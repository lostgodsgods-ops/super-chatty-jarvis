name: Gemini live staging smoke test

on:
  push:
    branches:
      - fix/cloudflare-token-config
    paths:
      - "src/worker.mjs"
      - "wrangler.gemini-staging.jsonc"
      - "wrangler.gemini-staging-disabled.jsonc"
      - ".github/workflows/gemini-staging-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-staging:
    name: Deploy isolated staging Worker and call Gemini
    if: github.ref == 'refs/heads/fix/cloudflare-token-config'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run safety and behavior tests
        run: npm test

      - name: Require live credentials before deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '6c0d1ab7b0d730f94359a89a77a0dcf2' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::CLOUDFLARE_API_TOKEN is missing."; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing."; exit 1; }
          [[ -n "$GEMINI_API_KEY" ]] || { echo "::error::GEMINI_API_KEY repository secret is missing."; exit 1; }
          echo "Required credentials are present (values are not printed)."

      - name: Deploy staging Worker with chat disabled
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '6c0d1ab7b0d730f94359a89a77a0dcf2' }}
        run: npx --yes wrangler@4.149.0 deploy src/worker.mjs --config wrangler.gemini-staging-disabled.jsonc

      - name: Verify CHAT_API_ENABLED=false rejects requests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://super-chatty-gemini-staging.lostgodsgods.workers.dev/api/chat';
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ message: 'This request must be rejected while chat is disabled.' }),
            signal: AbortSignal.timeout(10000)
          });
          const data = await response.json().catch(() => ({}));
          if (response.status !== 503 || data.ok !== false || data.error !== 'AI chat is not configured') {
            console.error('Disabled-mode negative test FAILED. HTTP:', response.status, 'error:', data.error || 'invalid JSON response');
            process.exit(1);
          }
          console.log('PASS: CHAT_API_ENABLED=false returned HTTP 503 with the expected safe error.');
          console.log('No provider call is expected: the worker checks the feature flag before rate limiting and upstream fetch.');
          await import('node:fs/promises').then(fs => fs.appendFile(process.env.GITHUB_STEP_SUMMARY,
            '## Gemini staging disabled-mode negative test\\n\\n- Result: **PASS**\\n- HTTP status: 503\\n- Expected error: `AI chat is not configured`\\n- Worker rejects the request before any provider fetch (also covered by a unit test).\\n\\n'));
          NODE

      - name: Restore enabled Gemini staging Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '6c0d1ab7b0d730f94359a89a77a0dcf2' }}
        run: npx --yes wrangler@4.149.0 deploy src/worker.mjs --config wrangler.gemini-staging.jsonc

      - name: Bind Gemini API key as a Cloudflare secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '6c0d1ab7b0d730f94359a89a77a0dcf2' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4.149.0 secret put GEMINI_API_KEY --config wrangler.gemini-staging.jsonc
          echo "Gemini key bound to staging Worker; value was not printed."

      - name: Discover Gemini models available to this API key
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100', {
            headers: { 'x-goog-api-key': process.env.GEMINI_API_KEY }
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            console.error('Gemini model discovery failed. HTTP:', response.status, 'status:', data.error?.status || 'unknown', 'message:', String(data.error?.message || 'No message').slice(0, 200));
            process.exit(1);
          }
          const models = (data.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'));
          console.log('Models supporting generateContent:', models.map(m => m.name.split('models/').pop()).join(', '));
          if (!models.length) process.exit(1);
          NODE

      - name: Call live Gemini and collect technical feedback
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const endpoint = 'https://super-chatty-gemini-staging.lostgodsgods.workers.dev/api/chat';
          const message = [
            'Review this Super Chatty Jarvis staging design using only the facts in this prompt.',
            'It is a Cloudflare Worker using server-side provider selection, a GEMINI_API_KEY secret binding, a CHAT_API_ENABLED flag, and a rate-limit binding. It calls Gemini generateContent and returns a reply.',
            'Give: (1) a one-line readiness verdict, (2) three concrete engineering improvements, (3) one security caution, and (4) one next test to run. Do not claim you inspected code or systems beyond this description. Keep it concise.'
          ].join(' ');

          let response;
          let data = {};
          for (let attempt = 1; attempt <= 4; attempt++) {
            response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ message }),
              signal: AbortSignal.timeout(25000)
            });
            data = await response.json().catch(() => ({}));
            if (response.ok && data.ok === true && typeof data.reply === 'string' && data.reply.trim()) break;
            const transient = [502, 503, 504].includes(response.status);
            if (!transient || attempt === 4) {
              console.error('Gemini live call FAILED. HTTP:', response.status, 'Worker error:', data.error || 'invalid response', 'Provider status:', data.diagnostic?.providerStatus, 'Provider code:', data.diagnostic?.providerCode, 'Provider status text:', data.diagnostic?.providerErrorStatus, 'Provider message:', data.diagnostic?.providerMessage);
              process.exit(1);
            }
            const waitMs = attempt * 2000;
            console.log('Transient upstream response', response.status, '- retrying in', waitMs, 'ms (attempt', attempt + 1, 'of 4).');
            await new Promise(resolve => setTimeout(resolve, waitMs));
          }
          if (!response.ok || data.ok !== true || typeof data.reply !== 'string' || !data.reply.trim()) {
            console.error('Gemini live call FAILED after retries. HTTP:', response.status, 'Worker error:', data.error || 'invalid response');
            process.exit(1);
          }
          const reply = data.reply.trim().slice(0, 5000);
          const model = typeof data.model === 'string' ? data.model : 'not reported';
          const summary = [
            '## Gemini live staging smoke test',
            '',
            '- Result: **PASS**',
            '- Endpoint: `/api/chat` on isolated staging Worker',
            '- HTTP status: ' + response.status,
            '- Model reported by Worker: `' + model.replaceAll('`', '') + '`',
            '- Reply length: ' + reply.length + ' characters',
            '',
            '### Gemini feedback',
            '',
            reply,
            '',
            '> This was a live API response from the staging Worker. No API key value is included.'
          ].join('\n');
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          console.log('Gemini live call PASS. Model:', model, 'Reply length:', reply.length);
          console.log('Feedback is available in the GitHub Actions run summary; no credentials were logged.');
          NODE
