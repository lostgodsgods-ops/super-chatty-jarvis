name: Monitor Central Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monitor-central-agent.yml"
  workflow_run:
    workflows: ["Deploy Central Agent"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: super-chatty-central-agent-health
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check staging Central Agent health and Tavily configuration
        id: health
        shell: bash
        env:
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          code="$(curl --silent --show-error --max-time 15 --output "$body" --write-out '%{http_code}' "$CENTRAL_AGENT_URL/health" || true)"
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" != "200" ]]; then
            echo "::error::Staging Central Agent health check failed with HTTP $code."
            cat "$body"
            exit 1
          fi
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.ok!==true) throw Error("health ok flag is not true"); if(x.capabilities?.directWebSearchFallback!==true) throw Error("directWebSearchFallback is not enabled"); if(x.capabilities?.ownerAuthentication!==true) throw Error("ownerAuthentication is not configured"); if(x.capabilities?.durableTaskQueue!==true) throw Error("durableTaskQueue is not configured"); console.log(JSON.stringify({ok:x.ok,service:x.service,version:x.version,directWebSearchFallback:x.capabilities.directWebSearchFallback,tavilySearchConfigured:x.capabilities.tavilySearchConfigured,ownerAuthentication:x.capabilities.ownerAuthentication,durableTaskQueue:x.capabilities.durableTaskQueue},null,2));' "$body"

      - name: Verify durable queue Cron schedule
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"; unset CLOUDFLARE_API_TOKEN' EXIT
          code="$(curl --silent --show-error --max-time 15 --output "$tmp" --write-out '%{http_code}' -H "authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/shrill-silence-164f/schedules")"
          test "$code" = "200" || { echo "::error::Unable to read Central Agent Cron schedule (HTTP $code)"; exit 1; }
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.success!==true||!Array.isArray(x.result?.schedules)||!x.result.schedules.some(s=>s.cron==="*/15 * * * *")) throw Error("Expected configured Cron schedule */15 * * * *"); console.log(JSON.stringify({ok:true,expectedCron:"*/15 * * * *",configuredCrons:x.result.schedules.map(s=>s.cron)}));' "$tmp"

      - name: Verify owner-scoped durable queue endpoints without creating tasks
        shell: bash
        env:
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
          OWNER_PASSWORD: ${{ secrets.CENTRAL_AGENT_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OWNER_PASSWORD" || { echo "::error::Missing CENTRAL_AGENT_OWNER_PASSWORD"; exit 1; }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"; unset OWNER_PASSWORD' EXIT
          login_code="$(curl --silent --show-error --max-time 15 --output "$tmp/login.json" --write-out '%{http_code}' -H 'content-type: application/json' -X POST "$CENTRAL_AGENT_URL/auth/login" --data "$(node -e 'process.stdout.write(JSON.stringify({password:process.env.OWNER_PASSWORD}))')")"
          test "$login_code" = "200" || { echo "::error::Owner login failed during queue read-only check (HTTP $login_code)"; exit 1; }
          token="$(node -e 'const x=require(process.argv[1]); if(x.ok!==true||typeof x.token!=="string"||!x.token) process.exit(1); process.stdout.write(x.token)' "$tmp/login.json")"
          tasks_code="$(curl --silent --show-error --max-time 15 --output "$tmp/tasks.json" --write-out '%{http_code}' -H "authorization: Bearer $token" "$CENTRAL_AGENT_URL/tasks?limit=1")"
          test "$tasks_code" = "200" || { echo "::error::Owner queue listing failed (HTTP $tasks_code)"; exit 1; }
          results_code="$(curl --silent --show-error --max-time 15 --output "$tmp/results.json" --write-out '%{http_code}' -H "authorization: Bearer $token" "$CENTRAL_AGENT_URL/results?limit=1")"
          unset token OWNER_PASSWORD
          test "$results_code" = "200" || { echo "::error::Owner result listing failed (HTTP $results_code)"; exit 1; }
          node -e 'const fs=require("fs"); const t=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const r=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); if(t.ok!==true||!Array.isArray(t.tasks)||r.ok!==true||!Array.isArray(r.results)) throw Error("Queue/result response shape is invalid"); console.log(JSON.stringify({ok:true,queueEndpoint:"PASS",resultsEndpoint:"PASS",taskCountVisible:t.tasks.length,resultCountVisible:r.results.length,createdTask:false}));' "$tmp/tasks.json" "$tmp/results.json"

      - name: Verify unauthenticated task submission is denied
        shell: bash
        env:
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl --silent --show-error --max-time 15 --output "$tmp" --write-out '%{http_code}' -H 'content-type: application/json' -X POST "$CENTRAL_AGENT_URL/tasks" --data '{"query":"unauthorized monitor probe"}')"
          test "$code" = "401" || { echo "::error::Unauthenticated task submission was not denied with HTTP 401 (got $code)"; exit 1; }
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.error!=="Unauthorized. Sign in with your Owner password.") throw Error("Unexpected unauthenticated task response"); console.log(JSON.stringify({ok:true,unauthenticatedTaskSubmission:"DENIED",taskCreated:false}));' "$tmp"

      - name: Verify owner-authenticated Tavily live search
        shell: bash
        env:
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
          OWNER_PASSWORD: ${{ secrets.CENTRAL_AGENT_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${OWNER_PASSWORD:-}" ]]; then
            echo "::error::Missing repository secret CENTRAL_AGENT_OWNER_PASSWORD. Add the existing Owner password as a GitHub Actions secret; never put it in source code or chat."
            exit 2
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          login_code="$(curl --silent --show-error --max-time 15 --output "$tmp/login.json" --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -X POST "$CENTRAL_AGENT_URL/auth/login" \
            --data "$(node -e 'process.stdout.write(JSON.stringify({password:process.env.OWNER_PASSWORD}))')")"
          if [[ "$login_code" != "200" ]]; then
            echo "::error::Owner login failed with HTTP $login_code."
            exit 1
          fi
          token="$(node -e 'const x=require(process.argv[1]); if(x.ok!==true||typeof x.token!=="string"||!x.token) process.exit(1); process.stdout.write(x.token)' "$tmp/login.json")"
          search_code="$(curl --silent --show-error --max-time 20 --output "$tmp/search.json" --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $token" \
            -X POST "$CENTRAL_AGENT_URL/search" \
            --data '{"query":"Cloudflare Workers documentation health checks","searchDepth":"basic"}')"
          unset token OWNER_PASSWORD
          if [[ "$search_code" != "200" ]]; then
            echo "::error::Owner-authenticated /search failed with HTTP $search_code."
            node -e 'const fs=require("fs"); try { const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({error:x.error||"Search request failed"})); } catch { console.log("Search response was not valid JSON."); }' "$tmp/search.json"
            exit 1
          fi
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.ok!==true||!["tavily","duckduckgo-html","bing-news-rss","google-news-rss","gdelt-doc-api","wikipedia-api"].includes(x.provider)||!Array.isArray(x.results)||x.results.length<1) throw Error("Expected a configured live-search provider and at least one result"); const urls=x.results.map(r=>r.url); if(urls.some(u=>typeof u!=="string"||!/^https?:\/\//i.test(u))) throw Error("One or more result URLs are invalid"); console.log(JSON.stringify({ok:x.ok,provider:x.provider,resultCount:x.results.length,sourceUrls:urls},null,2));' "$tmp/search.json"

      - name: Verify scoped PWA bridge search endpoint directly
        shell: bash
        env:
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
          AGENT_GATEWAY_TOKEN: ${{ secrets.AGENT_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AGENT_GATEWAY_TOKEN" || { echo "::error::Missing AGENT_GATEWAY_TOKEN"; exit 1; }
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"; unset AGENT_GATEWAY_TOKEN' EXIT
          code="$(curl --silent --show-error --max-time 20 --output "$tmp" --write-out '%{http_code}' -H 'content-type: application/json' -H "authorization: Bearer $AGENT_GATEWAY_TOKEN" -X POST "$CENTRAL_AGENT_URL/internal/search" --data '{"query":"Cloudflare Workers health checks documentation","language":"en-IN"}')"
          if [[ "$code" != "200" ]]; then
            echo "::error::Scoped bridge endpoint /internal/search failed with HTTP $code"
            node -e 'const fs=require("fs"); try {const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({error:x.error||"Bridge search failed",code:x.code||null}));} catch {console.log("Bridge response was not valid JSON.");}' "$tmp"
            exit 1
          fi
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.ok!==true||x.core?.webSearchExecuted!==true||!["tavily","duckduckgo-html","bing-news-rss","google-news-rss","gdelt-doc-api","wikipedia-api"].includes(x.core?.searchProvider)||!Array.isArray(x.sources)||x.sources.length<1) throw Error("Expected the protected bridge route to return live web sources"); console.log(JSON.stringify({ok:x.ok,provider:x.provider,sourceCount:x.sources.length,searchProvider:x.core.searchProvider}));' "$tmp"

      - name: Verify current-information chat uses live web sources before model synthesis
        shell: bash
        env:
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
          AGENT_GATEWAY_TOKEN: ${{ secrets.AGENT_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AGENT_GATEWAY_TOKEN" || { echo "::error::Missing AGENT_GATEWAY_TOKEN"; exit 1; }
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"; unset AGENT_GATEWAY_TOKEN' EXIT
          code="$(curl --silent --show-error --max-time 30 --output "$tmp" --write-out '%{http_code}' -H 'content-type: application/json' -H "authorization: Bearer $AGENT_GATEWAY_TOKEN" -X POST "$CENTRAL_AGENT_URL/chat" --data '{"message":"What is the latest 2026 Cloudflare Workers update?","language":"en-IN"}')"
          if [[ "$code" != "200" ]]; then
            if node -e 'const fs=require("fs"); try {const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.exit(x.code==="AI_QUOTA_EXHAUSTED"?0:1)} catch {process.exit(1)}' "$tmp"; then
              echo "Current-information chat DEGRADED: model quota exhausted; separate Tavily search-proxy checks remain mandatory."
            else
              echo "::error::Current-information /chat failed with HTTP $code"; cat "$tmp"; exit 1
            fi
          else
            node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.ok!==true||x.core?.intent!=="current_information"||x.core?.webSearchExecuted!==true||!["tavily","duckduckgo-html","bing-news-rss","google-news-rss","gdelt-doc-api","wikipedia-api"].includes(x.core?.searchProvider)||!Array.isArray(x.sources)||x.sources.length<1) throw Error("Current-information chat did not prove live-web synthesis"); if(x.sources.some(s=>typeof s.url!=="string"||(!s.url.startsWith("https://")&&!s.url.startsWith("http://")))) throw Error("Invalid source URL"); console.log(JSON.stringify({ok:true,intent:x.core.intent,webSearchExecuted:x.core.webSearchExecuted,searchProvider:x.core.searchProvider,sourceCount:x.sources.length,externalActionsPerformed:x.core.externalActionsPerformed}));' "$tmp"
          fi

      - name: Probe Central Agent chat route dispatch without credentials
        shell: bash
        env:
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl --silent --show-error --max-time 15 --output "$tmp" --write-out '%{http_code}' -H 'content-type: application/json' -H 'authorization: Bearer route-probe-invalid' -X POST "$CENTRAL_AGENT_URL/chat" --data '{"message":"route probe","language":"en-IN"}' || true)"
          echo "Central Agent POST /chat route-probe HTTP $code"
          head -c 500 "$tmp" || true
          echo
          rm -f "$tmp"

      - name: Verify Talk to Chatty PWA chat and Tavily proxy end-to-end
        shell: bash
        env:
          PASSKEY_WORKER_URL: https://super-chatty-passkey-staging.lostgodsgods.workers.dev
          AGENT_GATEWAY_TOKEN: ${{ secrets.AGENT_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AGENT_GATEWAY_TOKEN" || { echo "::error::Missing AGENT_GATEWAY_TOKEN"; exit 1; }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"; unset AGENT_GATEWAY_TOKEN' EXIT
          health_code="$(curl --silent --show-error --max-time 15 --output "$tmp/health.json" --write-out '%{http_code}' "$PASSKEY_WORKER_URL/health")"
          test "$health_code" = "200" || { echo "::error::Talk to Chatty PWA health failed with HTTP $health_code"; exit 1; }
          node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.ok!==true||x.liveSearchConfigured!==true||!["tavily","duckduckgo-html","bing-news-rss","google-news-rss","gdelt-doc-api","wikipedia-api"].includes(x.searchProvider)) throw Error("PWA live search gateway is not configured"); console.log(JSON.stringify({ok:x.ok,liveSearchConfigured:x.liveSearchConfigured,searchProvider:x.searchProvider}));' "$tmp/health.json"
          chat_code="$(curl --silent --show-error --max-time 20 --output "$tmp/chat.json" --write-out '%{http_code}' -H 'content-type: application/json' -H "authorization: Bearer $AGENT_GATEWAY_TOKEN" -X POST "$PASSKEY_WORKER_URL/internal/chat-smoke" --data '{"message":"Reply with a short greeting for the Super Chatty Jarvis staging connectivity test.","language":"en-IN"}')"
          if [[ "$chat_code" != "200" ]]; then
            if node -e 'const fs=require("node:fs"); try {const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.exit(x.code==="AI_QUOTA_EXHAUSTED"?0:1)} catch {process.exit(1)}' "$tmp/chat.json"; then
              echo "Talk to Chatty PWA AI chat DEGRADED: explicit AI quota exhaustion; live-search proxy will still be verified."
            else
              echo "::error::Talk to Chatty PWA AI chat proxy failed with HTTP $chat_code"
              node -e 'const fs=require("node:fs"); try {const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({error:x.error||"Chat proxy failed",code:x.code||null,providerStatus:x.providerStatus||null,providerContentType:x.providerContentType||null,providerPayloadKeys:x.providerPayloadKeys||[]}));} catch {console.log("Chat response was not valid JSON.");}' "$tmp/chat.json"
              exit 1
            fi
          else
            node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.ok!==true||typeof x.reply!=="string"||!x.reply.trim()||x.core?.intent!=="chat"||x.core?.externalActionsPerformed!==false) throw Error("Expected a real AI chat reply with no external actions"); console.log(JSON.stringify({ok:x.ok,provider:x.provider,model:x.model,replyLength:x.reply.length,intent:x.core.intent,externalActionsPerformed:x.core.externalActionsPerformed}));' "$tmp/chat.json"
          fi
          search_code="$(curl --silent --show-error --max-time 25 --output "$tmp/search.json" --write-out '%{http_code}' -H 'content-type: application/json' -H "authorization: Bearer $AGENT_GATEWAY_TOKEN" -X POST "$PASSKEY_WORKER_URL/internal/search-smoke" --data '{"query":"Cloudflare Workers health checks documentation"}')"
          if [[ "$search_code" != "200" ]]; then
            echo "::error::Talk to Chatty PWA Tavily proxy failed with HTTP $search_code"
            node -e 'const fs=require("node:fs"); try {const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({error:x.error||"Search proxy failed",code:x.code||null,providerStatus:x.providerStatus||null,upstreamPath:x.upstreamPath||null}));} catch {console.log("Search response was not valid JSON.");}' "$tmp/search.json"
            exit 1
          fi
          node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.ok!==true||x.core?.webSearchExecuted!==true||!["tavily","duckduckgo-html","bing-news-rss","google-news-rss","gdelt-doc-api","wikipedia-api"].includes(x.core?.searchProvider)||!Array.isArray(x.sources)||x.sources.length<1) throw Error("Expected a live web result with at least one source"); if(x.sources.some(s=>typeof s.url!=="string"||!/^https?:\/\//i.test(s.url))) throw Error("Invalid source URL"); console.log(JSON.stringify({ok:x.ok,searchProvider:x.core.searchProvider,sourceCount:x.sources.length,sourceUrls:x.sources.map(s=>s.url)},null,2));' "$tmp/search.json"

      - name: Verify authenticated event bus and module registry
        shell: bash
        env:
          CENTRAL_AGENT_URL: https://shrill-silence-164f.lostgodsgods.workers.dev
          OWNER_PASSWORD: ${{ secrets.CENTRAL_AGENT_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OWNER_PASSWORD" || { echo "::error::Missing CENTRAL_AGENT_OWNER_PASSWORD"; exit 1; }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"; unset OWNER_PASSWORD' EXIT
          login_code="$(curl --silent --show-error --max-time 15 --output "$tmp/login.json" --write-out '%{http_code}' -H 'content-type: application/json' -X POST "$CENTRAL_AGENT_URL/auth/login" --data "$(node -e 'process.stdout.write(JSON.stringify({password:process.env.OWNER_PASSWORD}))')")"
          test "$login_code" = "200" || { echo "::error::Owner login failed during event bus check (HTTP $login_code)"; exit 1; }
          token="$(node -e 'const x=require(process.argv[1]); if(x.ok!==true||typeof x.token!=="string"||!x.token) process.exit(1); process.stdout.write(x.token)' "$tmp/login.json")"
          modules_code="$(curl --silent --show-error --max-time 10 --output "$tmp/modules.json" --write-out '%{http_code}' -H "authorization: Bearer $token" "$CENTRAL_AGENT_URL/api/modules")"
          test "$modules_code" = "200" || { echo "::error::Authenticated /api/modules failed (HTTP $modules_code)"; exit 1; }
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.ok!==true||x.registry!=="central-event-bus"||!Array.isArray(x.modules)||!x.modules.some(m=>m.id==="pwa-event-stream")||!x.modules.some(m=>m.id==="agent-orchestrator")) throw Error("Module registry response is invalid"); console.log(JSON.stringify({ok:true,registry:x.registry,moduleCount:x.modules.length,agentModule:"PASS",pwaStreamModule:"PASS"}));' "$tmp/modules.json"
          stream_code="$(curl --silent --show-error --no-buffer --max-time 4 --output "$tmp/events.txt" --write-out '%{http_code}' -H "authorization: Bearer $token" -H 'accept: text/event-stream' "$CENTRAL_AGENT_URL/api/events" || true)"
          unset token OWNER_PASSWORD
          test "$stream_code" = "200" || { echo "::error::Authenticated /api/events failed (HTTP $stream_code)"; cat "$tmp/events.txt"; exit 1; }
          grep -q '^event: heartbeat' "$tmp/events.txt" || { echo "::error::SSE heartbeat was not observed"; cat "$tmp/events.txt"; exit 1; }
          echo '{"ok":true,"authenticatedSSE":"PASS","heartbeat":"PASS","readOnly":true}'

      - name: Open or update incident issue on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Central Agent health check failed";
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const existing = open.data.find(i => i.title === title && !i.pull_request);
            const body = [
              "The scheduled Central Agent health check failed.",
              "",
              "Workflow run: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId,
              "Event: " + context.eventName,
              "",
              "Check the configured CENTRAL_AGENT_URL, Worker deployment status, and Cloudflare logs.",
              "This monitor reports failures; it does not change secrets, modify permissions, merge code, or deploy fixes."
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
