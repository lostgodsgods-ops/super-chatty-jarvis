name: Static site checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test public page safety and behavior
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run static site and passkey tests
        run: npm test
      - name: Run Central Agent policy and owner-auth tests
        run: node --test central-agent/policy.test.mjs central-agent/owner-auth.test.mjs