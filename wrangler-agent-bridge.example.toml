name = "super-chatty-jarvis-agent-relay-staging"
main = "agent-bridge-worker.js"
compatibility_date = "2026-10-13"

[[kv_namespaces]]
binding = "JARVIS_KV"
id = "REPLACE_WITH_STAGING_KV_NAMESPACE_ID"

[vars]
ENVIRONMENT = "staging"
